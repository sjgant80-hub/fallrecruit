    STATE.config.models[modality] = STATE.config.models[modality] || {};
    if (model) STATE.config.models[modality][providerKey] = model;
    saveConfig();
  }
  function forgetKeys() { STATE.secrets = emptyKeys(); STATE.config.remember_keys = false; saveConfig(); renderAiChip(); }

  // ─── DOM helpers ────────────────────────────────────────────────────
  function $(s, root) { return (root || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  // ─── AI tier ────────────────────────────────────────────────────────
  function aiTier() { return STATE.config.ai_tier || 'T0'; }
  function activeTextProvider() { return STATE.config.text_provider || 'anthropic'; }

  function renderAiChip() {
    const chip = $('#fk-ai-chip');
    if (!chip) return;
    const txt = $('#fk-ai-chip-text');
    chip.classList.remove('fk-chip-live', 'fk-chip-loading', 'fk-chip-warn');
    const tier = aiTier();
    if (tier === 'T0') { txt.textContent = 'T0 · off'; }
    else if (tier === 'T2') {
      if (STATE.ai.ready) { txt.textContent = 'T2 ' + (WEBLLM_MODELS[STATE.config.webllm_model || DEFAULT_MODEL]?.label.split(' · ')[0] || '') + ' · ready'; chip.classList.add('fk-chip-live'); }
      else if (STATE.ai.loading) { txt.textContent = 'T2 loading ' + Math.round(STATE.ai.progress) + '%'; chip.classList.add('fk-chip-loading'); }
      else { txt.textContent = 'T2 · click to load'; chip.classList.add('fk-chip-warn'); }
    } else if (tier === 'T3') {
      const p = activeTextProvider();
      if (getKey('text', p)) { txt.textContent = 'T3 ' + (TEXT_PROVIDERS[p]?.label.split(' ')[0] || 'BYOK') + ' · active'; chip.classList.add('fk-chip-live'); }
      else { txt.textContent = 'T3 · no key set'; chip.classList.add('fk-chip-warn'); }
    }
  }

  async function loadWebLLM(modelKey) {
    if (STATE.ai.loading) return;
    const key = modelKey || STATE.config.webllm_model || DEFAULT_MODEL;
    const model = WEBLLM_MODELS[key];
    if (!model) { console.error('fall-kit: unknown model', key); return; }
    if (STATE.ai.ready && STATE.ai.model === model.id) return;
    STATE.ai.loading = true; STATE.ai.progress = 0; renderAiChip();
    notify('Loading WebLLM · ' + model.label + ' · ' + model.size + ' first time', 'info');
    try {
      const { CreateMLCEngine } = await import('https://esm.run/@mlc-ai/web-llm@0.2.79');
      const engine = await CreateMLCEngine(model.id, {
        initProgressCallback: p => { STATE.ai.progress = (p.progress || 0) * 100; renderAiChip(); }
      });
      STATE.ai.engine = engine; STATE.ai.model = model.id; STATE.ai.ready = true; STATE.ai.loading = false;
      STATE.config.webllm_model = key; saveConfig(); renderAiChip();
      notify('WebLLM ready · sovereign mode · ' + model.label.split(' · ')[0], 'ok');
    } catch (e) {
      console.error('fall-kit: WebLLM load failed', e);
      STATE.ai.loading = false; renderAiChip();
      notify('WebLLM load failed · ' + e.message, 'err');
    }
  }

  // ═══════════════════════ TEXT · aiComplete · aiChat ═══════════════
  // One way to ask every text provider: the system prompt first and the same each call (so a provider can reuse its
  // reading of it), then the conversation, which only ever grows. Pure pieces (requestOf, textOf, usageOf) are exposed
  // on FallKit for tests; nothing pure here touches the network.
  const isObj = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);
  const count = (x) => (Number.isInteger(x) && x >= 0 ? x : 0);
  /** Claude models from 5.x think before they answer: room for that, and a light effort for an assistant's reply */
  const THINKS = (model) => /^claude-(?:opus|sonnet|haiku|fable|mythos)-5/.test(model);
  /** Claude models with a server-side fallback when a request is declined (Haiku has none) */
  const FALLS_BACK = (model) => /^claude-(?:opus|sonnet|fable)-5/.test(model);
  /** a message's words, whatever shape a provider keeps it in */
  function wordsOf(m) {
    if (!isObj(m)) return '';
    if (typeof m.content === 'string') return m.content;
    if (Array.isArray(m.content)) return m.content.filter((b) => isObj(b) && b.type === 'text' && typeof b.text === 'string').map((b) => b.text).join('\n');
    return '';
  }
  /**
   * The request a text provider is sent: { url, headers, body } for type (anthropic | openai | google | openai_compat |
   * cohere | hf_inference). messages: [{ role: 'user' | 'assistant', content }]. Pure: the key is placed, never kept.
   */
  function requestOf(type, opts) {
    const { model, key, system, messages, maxTokens, url } = opts;
    const max = Number.isInteger(maxTokens) && maxTokens > 0 ? maxTokens : 600;
    const plain = messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: wordsOf(m) }));
    if (type === 'anthropic') {
      const headers = { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
      const body = { model, max_tokens: THINKS(model) ? Math.max(max * 4, 4000) : max, system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral' } }],
        messages: messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content })) };
      if (THINKS(model)) body.output_config = { effort: 'low' };
      if (FALLS_BACK(model)) { headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; body.fallbacks = 'default'; }
      return { url: 'https://api.anthropic.com/v1/messages', headers, body };
    }
    if (type === 'openai') return { url: 'https://api.openai.com/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_completion_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'google') return { url: 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
      body: { systemInstruction: { parts: [{ text: system }] }, contents: plain.map((m) => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })), generationConfig: { maxOutputTokens: max } } };
    if (type === 'cohere') return { url: 'https://api.cohere.com/v2/chat', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'hf_inference') return { url: 'https://api-inference.huggingface.co/models/' + model + '/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'openai_compat') return { url: url, headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    return null;
  }
  /** the answer's words from a provider's reply, or null when it declined or said nothing. Pure. */
  function textOf(type, j) {
    if (!isObj(j)) return null;
    let t = '';
    if (type === 'anthropic') { if (j.stop_reason === 'refusal' || !Array.isArray(j.content)) return null; t = wordsOf({ content: j.content }); }
    else if (type === 'google') { const c = Array.isArray(j.candidates) ? j.candidates[0] : null; t = c && isObj(c.content) && Array.isArray(c.content.parts) ? c.content.parts.map((p) => (isObj(p) && typeof p.text === 'string' ? p.text : '')).join('') : ''; }
    else if (type === 'cohere') { t = isObj(j.message) && Array.isArray(j.message.content) ? wordsOf({ content: j.message.content.map((b) => Object.assign({ type: 'text' }, b)) }) : ''; }
    else { const c = Array.isArray(j.choices) ? j.choices[0] : null; t = c && isObj(c.message) && typeof c.message.content === 'string' ? c.message.content : ''; }
    t = t.trim();
    return t ? t : null;
  }
  /** what a call used, read from a provider's own usage record: { read, recycled, written, out }. Pure. */
  function usageOf(type, j) {
    const u = isObj(j) ? (type === 'google' ? j.usageMetadata : type === 'cohere' && isObj(j.usage) ? j.usage.tokens : j.usage) : null;
    if (!isObj(u)) return { read: 0, recycled: 0, written: 0, out: 0 };
    if (type === 'anthropic') { const recycled = count(u.cache_read_input_tokens), written = count(u.cache_creation_input_tokens); return { read: count(u.input_tokens) + recycled + written, recycled, written, out: count(u.output_tokens) }; }
    if (type === 'google') { const read = count(u.promptTokenCount); return { read, recycled: Math.min(read, count(u.cachedContentTokenCount)), written: 0, out: count(u.candidatesTokenCount) + count(u.thoughtsTokenCount) }; }
    if (type === 'cohere') return { read: count(u.input_tokens), recycled: 0, written: 0, out: count(u.output_tokens) };
    const read = count(u.prompt_tokens), d = isObj(u.prompt_tokens_details) ? u.prompt_tokens_details : {};
    return { read, recycled: Math.min(read, count(d.cached_tokens)), written: 0, out: count(u.completion_tokens) };
  }

  async function aiComplete(systemPrompt, userMsg, maxTokens) {
    const r = await aiChat(systemPrompt, [], userMsg, maxTokens);
    return r ? r.text : null;
  }
  /**
   * One turn of a conversation: the system prompt, the history so far (unchanged), and the user's words. → { text,
   * assistant } — the caller appends { role: 'user', content: userMsg } and `assistant` to its history (assistant is the
   * reply as the provider gave it, so a provider that checks its own earlier turns sees them unchanged) — or null when no
   * tier can answer.
   */
  async function aiChat(systemPrompt, history, userMsg, maxTokens) {
    maxTokens = maxTokens || 600;
    const messages = (Array.isArray(history) ? history : []).concat([{ role: 'user', content: String(userMsg == null ? '' : userMsg) }]);
    const tier = aiTier();
    if (tier === 'T2' && STATE.ai.ready && STATE.ai.engine) {
      const r = await STATE.ai.engine.chat.completions.create({
        messages: [{ role: 'system', content: systemPrompt }].concat(messages.map((m) => ({ role: m.role, content: wordsOf(m) }))), max_tokens: maxTokens,
      });
      const text = r.choices[0].message.content;
      STATE.lastUsage = Object.assign({ provider: 'webllm' }, usageOf('openai', r));
      return { text: text, assistant: { role: 'assistant', content: text } };
    }
    if (tier === 'T3') {
      const p = activeTextProvider(); const key = getKey('text', p);
      if (!key) return null;
      return await textCall(p, systemPrompt, messages, maxTokens);
    }
    return null;
  }

  async function textCall(providerKey, sys, messages, maxTokens) {
    const p = TEXT_PROVIDERS[providerKey];
    const model = getModel('text', providerKey, TEXT_PROVIDERS);
    const req = requestOf(p.type, { model, key: getKey('text', providerKey), system: sys, messages, maxTokens, url: p.url });
    if (!req) throw new Error('unknown text provider type: ' + p.type);
    const r = await fetch(req.url, { method: 'POST', headers: req.headers, body: JSON.stringify(req.body) });
    if (!r.ok) throw new Error(p.label + ' ' + r.status);
    const j = await r.json();
    STATE.lastUsage = Object.assign({ provider: providerKey, model: model }, usageOf(p.type, j));
    const text = textOf(p.type, j);
    if (text === null) return null;
    return { text: text, assistant: p.type === 'anthropic' ? { role: 'assistant', content: j.content } : { role: 'assistant', content: text } };
  }

  // ═══════════════════════ ASK · about this page ═════════════════════
  // The kit's own use of the brain, so the chip is useful in any build, wired or not: a question about the page, answered
  // from the page's own words. The opening is read once per talk and sent byte-identical every question, so a provider
  // that caches recycles it; a talk starts afresh after MAX_ASKS questions or when the person starts again.
  const PAGE_MAX = 12000, MAX_ASKS = 20;
  const ASK_OPENING = 'You are the helper inside a web page. Answer questions about this page and how to use it, briefly and in plain words. Use only what the page says below; when it does not say, say so.';
  /** the opening for questions about a page: who the helper is, then the page's title, description and text. Pure. */
  function pageOpening(page) {
    const p = isObj(page) ? page : {};
    const line = (s, n) => (typeof s === 'string' ? s : '').replace(/\s+/g, ' ').trim().slice(0, n);
    const text = (typeof p.text === 'string' ? p.text : '').replace(/[ \t\r\f\v]+/g, ' ').replace(/ *\n[\s]*/g, '\n').trim().slice(0, PAGE_MAX);
    const about = line(p.description, 400);
    return ASK_OPENING + '\n\nPAGE: ' + (line(p.title, 200) || '(no title)') + '\n' + (about ? 'ABOUT: ' + about + '\n' : '') + 'TEXT:\n' + text;
  }
  function readPage() {   // the page as its reader has it, without the kit's own chip, panel and code
    const d = document.querySelector('meta[name="description"]');
    const body = document.body ? document.body.cloneNode(true) : null;
    if (body) {
      body.querySelectorAll('#fk-modal-bg, #fk-ai-chip, #fk-toast, script, style, noscript, template').forEach((e) => e.remove());
      body.querySelectorAll('td, th').forEach((e) => e.append(' | '));   // keep cells and blocks apart, as a reader sees them
      body.querySelectorAll('p, div, li, tr, h1, h2, h3, h4, h5, h6, br, pre, dt, dd, figcaption, blockquote, section, article, header, footer, nav, label, button, option').forEach((e) => e.append('\n'));
    }
    return { title: document.title, description: d ? d.getAttribute('content') : '', text: body ? body.textContent : '' };
  }
  async function askPage(question) {
    const q = String(question == null ? '' : question).trim();
    if (!q) return { text: null, why: 'Type a question first.' };
    if (aiTier() === 'T0') return { text: null, why: 'AI is off. Pick T2 (a model in your browser) or T3 (your own key) below, press Save, then ask.' };
    const t = STATE.ask;
    if (!t.opening || t.talk.length >= MAX_ASKS * 2) { t.opening = pageOpening(readPage()); t.talk = []; }
    const r = await aiChat(t.opening, t.talk, q, 600);
    if (!r) return { text: null, why: aiTier() === 'T2' ? 'The in-browser model is not loaded yet: press Load model below.' : 'No key is set for this provider: add one below and press Save.' };
    t.talk.push({ role: 'user', content: q }, r.assistant);
    t.last = r.text;
    return { text: r.text, why: null };
  }

  // ═══════════════════════ IMAGE · aiImage ═══════════════════════════
  async function aiImage(prompt, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.image_provider || 'fal';
    const p = IMAGE_PROVIDERS[providerKey];
    const key = getKey('image', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('image', providerKey, IMAGE_PROVIDERS);

    if (p.type === 'fal') {
      const r = await fetch('https://fal.run/' + model, {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Key ' + key },
        body: JSON.stringify({ prompt, image_size: opts.size || 'landscape_4_3', num_inference_steps: opts.steps || 4 }),
      });
      if (!r.ok) throw new Error('fal ' + r.status);
      const j = await r.json();
      return { url: j.images?.[0]?.url || j.image?.url, raw: j };
    }
    if (p.type === 'hf_image') {
      const r = await fetch('https://api-inference.huggingface.co/models/' + model, {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ inputs: prompt }),
      });
      if (!r.ok) throw new Error('HF ' + r.status);
      const blob = await r.blob();
      return { url: URL.createObjectURL(blob), blob };
    }
    if (p.type === 'replicate') {
      const r = await fetch('https://api.replicate.com/v1/predictions', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Token ' + key, 'Prefer': 'wait' },
        body: JSON.stringify({ version: model, input: { prompt, num_outputs: 1 } }),
      });
      if (!r.ok) throw new Error('Replicate ' + r.status);
      const j = await r.json();
      return { url: Array.isArray(j.output) ? j.output[0] : j.output, raw: j };
    }
    if (p.type === 'openai_image') {
      const r = await fetch('https://api.openai.com/v1/images/generations', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, prompt, n: 1, size: opts.size || '1024x1024' }),
      });
      if (!r.ok) throw new Error('OpenAI ' + r.status);
      const j = await r.json();
      return { url: j.data[0].url, raw: j };
    }
    if (p.type === 'openai_image_compat') {
      const r = await fetch(p.url, {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, prompt, n: 1 }),
      });
      if (!r.ok) throw new Error(p.label + ' ' + r.status);
      const j = await r.json();
      return { url: j.data[0].url, raw: j };
    }
    if (p.type === 'google_image') {
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':predict?key=' + encodeURIComponent(key), {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ instances: [{ prompt }], parameters: { sampleCount: 1 } }),
      });
      if (!r.ok) throw new Error('Google Imagen ' + r.status);
      const j = await r.json();
      return { url: 'data:image/png;base64,' + j.predictions[0].bytesBase64Encoded, raw: j };
    }
    if (p.type === 'ideogram') {
      const r = await fetch('https://api.ideogram.ai/generate', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Api-Key': key },
        body: JSON.stringify({ image_request: { prompt, model, aspect_ratio: opts.size || 'ASPECT_16_9' } }),
      });
      if (!r.ok) throw new Error('Ideogram ' + r.status);
      const j = await r.json();
      return { url: j.data[0].url, raw: j };
    }
    if (p.type === 'leonardo') {
      const r = await fetch('https://cloud.leonardo.ai/api/rest/v1/generations', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ prompt, modelId: model, num_images: 1, width: 1024, height: 576 }),
      });
      if (!r.ok) throw new Error('Leonardo ' + r.status);
      const j = await r.json();
      return { id: j.sdGenerationJob.generationId, raw: j, note: 'poll /generations/:id for URL' };
    }
    throw new Error('unknown image provider type: ' + p.type);
  }

  // ═══════════════════════ VIDEO · aiVideo ═══════════════════════════

  // ═══════════════════════ TTS · aiTTS ═══════════════════════════════
  async function aiTTS(text, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.tts_provider || 'elevenlabs';
    const p = TTS_PROVIDERS[providerKey];
    const key = getKey('tts', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('tts', providerKey, TTS_PROVIDERS);

    if (p.type === 'elevenlabs') {
      const voice = opts.voice || '21m00Tcm4TlvDq8ikWAM';
      const r = await fetch('https://api.elevenlabs.io/v1/text-to-speech/' + voice, {
        method: 'POST', headers: { 'xi-api-key': key, 'content-type': 'application/json' },
        body: JSON.stringify({ text, model_id: model }),
      });
      if (!r.ok) throw new Error('ElevenLabs ' + r.status);
      const blob = await r.blob();
      return { url: URL.createObjectURL(blob), blob };
    }
    if (p.type === 'openai_tts') {
      const r = await fetch('https://api.openai.com/v1/audio/speech', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, input: text, voice: opts.voice || 'alloy' }),
      });
      if (!r.ok) throw new Error('OpenAI TTS ' + r.status);
      const blob = await r.blob();
      return { url: URL.createObjectURL(blob), blob };
    }
    if (p.type === 'cartesia') {
      const r = await fetch('https://api.cartesia.ai/tts/bytes', {
        method: 'POST', headers: { 'content-type': 'application/json', 'X-API-Key': key, 'Cartesia-Version': '2024-11-13' },
        body: JSON.stringify({ model_id: model, transcript: text, voice: { mode: 'id', id: opts.voice || 'a0e99841-438c-4a64-b679-ae501e7d6091' }, output_format: { container: 'mp3', encoding: 'mp3', sample_rate: 44100 } }),
      });
      if (!r.ok) throw new Error('Cartesia ' + r.status);
      const blob = await r.blob();
      return { url: URL.createObjectURL(blob), blob };
    }
    if (p.type === 'playht') {
      const r = await fetch('https://api.play.ht/api/v2/tts/stream', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key, 'X-USER-ID': opts.userId || '' },
        body: JSON.stringify({ text, voice: opts.voice || 's3://voice-cloning-zero-shot/d9ff78ba-d016-47f6-b0ef-dd630f59414e/female-cs/manifest.json', voice_engine: model }),
      });
      if (!r.ok) throw new Error('PlayHT ' + r.status);
      const blob = await r.blob();
      return { url: URL.createObjectURL(blob), blob };
    }
    throw new Error('unknown TTS provider type: ' + p.type);
  }

  // ═══════════════════════ STT · aiSTT ═══════════════════════════════
  async function aiSTT(blob, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.stt_provider || 'deepgram';
    const p = STT_PROVIDERS[providerKey];
    const key = getKey('stt', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('stt', providerKey, STT_PROVIDERS);

    if (p.type === 'deepgram') {
      const r = await fetch('https://api.deepgram.com/v1/listen?model=' + model + '&smart_format=true', {
        method: 'POST', headers: { 'Authorization': 'Token ' + key, 'content-type': blob.type || 'audio/wav' },
        body: blob,
      });
      if (!r.ok) throw new Error('Deepgram ' + r.status);
      const j = await r.json();
      return { text: j.results?.channels?.[0]?.alternatives?.[0]?.transcript, raw: j };
    }
    if (p.type === 'assemblyai') {
      const up = await fetch('https://api.assemblyai.com/v2/upload', { method: 'POST', headers: { 'Authorization': key }, body: blob });
      const upJ = await up.json();
      const r = await fetch('https://api.assemblyai.com/v2/transcript', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': key },
        body: JSON.stringify({ audio_url: upJ.upload_url, speech_model: model }),
      });
      if (!r.ok) throw new Error('AssemblyAI ' + r.status);
      const j = await r.json();
      return { id: j.id, raw: j, note: 'poll for text' };
    }
    if (p.type === 'openai_stt') {
      const fd = new FormData();
      fd.append('file', blob, 'audio.wav');
      fd.append('model', model);
      const r = await fetch('https://api.openai.com/v1/audio/transcriptions', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + key }, body: fd,
      });
      if (!r.ok) throw new Error('OpenAI Whisper ' + r.status);
      const j = await r.json();
      return { text: j.text, raw: j };
    }
    throw new Error('unknown STT provider type: ' + p.type);
  }

  // ─── WebRTC P2P mesh ────────────────────────────────────────────────
  const MESH_CHANNEL = 'fall-signal';
  function meshStart(opts) {
    if (STATE.mesh.active) return;
    opts = opts || {};
    const seedId = opts.seedId || (location.pathname + '#' + Math.random().toString(36).slice(2, 8));
    STATE.mesh.seedId = seedId;
    try { STATE.mesh.bc = new BroadcastChannel(MESH_CHANNEL); }
    catch (e) { console.warn('fall-kit: BroadcastChannel unavailable'); return; }
    STATE.mesh.bc.onmessage = e => {
      const m = e.data;
      if (!m || !m.kind || m.peerId === seedId) return;
      if (opts.onMessage) opts.onMessage(m);
    };
    STATE.mesh.bc.postMessage({ kind: 'fall-kit:hello', peerId: seedId, ts: Date.now(), seedName: opts.seedName || 'unknown' });
    STATE.mesh.active = true;
    notify('Mesh active · channel ' + MESH_CHANNEL, 'ok');
  }
  function meshPost(kind, payload) {
    if (!STATE.mesh.active || !STATE.mesh.bc) return false;
    STATE.mesh.bc.postMessage({ kind: kind, peerId: STATE.mesh.seedId, ts: Date.now(), payload: payload });
    return true;
  }

  // ─── Toast ──────────────────────────────────────────────────────────
  function notify(msg, kind) {
    let t = $('#fk-toast');
    if (!t) {
      t = document.createElement('div'); t.id = 'fk-toast';
      t.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:#c08a3a;color:#0a0a0a;padding:9px 18px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:0;transition:all .22s;z-index:10000;pointer-events:none';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.background = kind === 'err' ? '#a14a2a' : kind === 'ok' ? '#6b8d4a' : '#c08a3a';
    t.style.color = kind === 'err' ? '#fff' : '#0a0a0a';
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._to);
    t._to = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2400);
  }

      .fk-ai-assist { display:inline-flex; align-items:center; gap:5px; padding:4px 9px; font-size:11px; border:1px solid #c08a3a; color:#c08a3a; background:transparent; border-radius:3px; cursor:pointer; font-family:inherit }
      .fk-ai-assist:hover { background:#c08a3a; color:#0a0a0a }
      .fk-ai-assist::before { content:'✦'; font-size:12px }
    `;
    document.head.appendChild(s);
  }

  // ─── The floating chip keeps clear of the build's own fixed bars and controls ─────────
  // A build's bottom tab bar or floating button stays put while the page scrolls, so a chip over it would hide it. The
  // chip looks at what is under it and moves up past it; a fixed container as tall as the page counts only by the
  // control under the chip. Content that scrolls is not in the way.
  function blockerUnder(el) {
    let fixed = null;
    for (let e = el; e && e !== document.body && e !== document.documentElement; e = e.parentElement) {
      const pos = getComputedStyle(e).position;
      if (pos === 'fixed' || pos === 'sticky') { fixed = e; break; }
    }
    if (!fixed) return null;
    if (fixed.getBoundingClientRect().height <= innerHeight * 0.4) return fixed;
    return el.closest('button, a, input, select, textarea, label, [role=button], [tabindex]');
  }
  function placeChip(chip) {
    if (!chip || chip.dataset.anchored) return;
    chip.style.top = ''; chip.style.bottom = '14px';
    for (let i = 0; i < 6; i++) {
      const r = chip.getBoundingClientRect();
      chip.style.visibility = 'hidden';
      const hit = [[r.left + 2, r.top + 2], [r.right - 2, r.top + 2], [r.left + 2, r.bottom - 2], [r.right - 2, r.bottom - 2]]
        .map(([x, y]) => document.elementFromPoint(x, y)).filter(Boolean).map(blockerUnder).find(Boolean);
      chip.style.visibility = '';
      if (!hit) return;
      const bottom = innerHeight - hit.getBoundingClientRect().top + 8;
      if (bottom > innerHeight * 0.6) { chip.style.bottom = ''; chip.style.top = '14px'; return; }
      chip.style.bottom = bottom + 'px';
    }
  }

  // ─── Init ───────────────────────────────────────────────────────────
  function init(opts) {
    opts = opts || {};
    injectCss();
    if (opts.seedName) STATE.config.seedName = opts.seedName;
    if ($('#fk-ai-chip')) { renderAiChip(); return { version: FALL_KIT_VERSION, mounted: false }; }
    const chip = document.createElement('button');
    chip.id = 'fk-ai-chip';
    chip.title = 'AI helper · ask about this page, or pick the brain';
    chip.innerHTML = '<span class="fk-dot"></span><span id="fk-ai-chip-text">T0 · off</span>';
    chip.onclick = () => openSettings();
    const anchor = opts.chipAnchor ? $(opts.chipAnchor) : null;
    if (anchor) { anchor.appendChild(chip); chip.dataset.anchored = '1'; }
    else {
      chip.style.cssText += ';position:fixed;bottom:14px;left:14px;z-index:9998;box-shadow:0 4px 14px rgba(0,0,0,.4)';
      document.body.appendChild(chip);
      const place = () => placeChip(chip);
      setTimeout(place, 0); setTimeout(place, 1200);   // once now, once after the build has laid itself out
      let t = null; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(place, 200); });
    }
    renderAiChip();
    if (BOOT.moved) notify('AI keys are now held in this tab only · tick “remember” in AI settings to keep them', 'info');
    return { version: FALL_KIT_VERSION, mounted: true };
  }

  // ─── Public API ─────────────────────────────────────────────────────
  root.FallKit = {
    version: FALL_KIT_VERSION,
    init: init,
    aiTier: aiTier,
    aiComplete: aiComplete,
    aiChat: aiChat,
    askPage: askPage,
    pageOpening: pageOpening,
    lastUsage: () => STATE.lastUsage,
    forgetKeys: forgetKeys,
    requestOf: requestOf,
    textOf: textOf,
    usageOf: usageOf,
    configFrom: configFrom,
    storedForm: storedForm,
    aiImage: aiImage,
    aiVideo: aiVideo,
    aiTTS: aiTTS,
    aiSTT: aiSTT,
    loadWebLLM: loadWebLLM,
    openSettings: openSettings,
    closeSettings: closeSettings,
    renderAiChip: renderAiChip,
    helpSection: helpSection,
    meshStart: meshStart,
    meshPost: meshPost,
    notify: notify,
    MODELS: WEBLLM_MODELS,
    TEXT_PROVIDERS: TEXT_PROVIDERS,
    IMAGE_PROVIDERS: IMAGE_PROVIDERS,
    VIDEO_PROVIDERS: VIDEO_PROVIDERS,
    TTS_PROVIDERS: TTS_PROVIDERS,
    STT_PROVIDERS: STT_PROVIDERS,
    state: STATE,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

    else go();

<body>
<div class="app">
<header>
  <div class="brand"><div class="mark">◊</div><div><div class="name">FallRecruit</div></div><div class="seal">v1 · prime 977</div></div>
  <nav class="tabs" id="tabNav"></nav>
  <div class="tools-r"><button class="tool-btn" id="tierBadge" onclick="openModal('settings')">T0</button><button class="tool-btn" onclick="openModal('settings')">⚙</button></div>
</header>
<main id="view"></main>
</div>
<div class="modal-bg" id="modal"><div class="modal"><h2 id="modalTitle">.</h2><div id="modalBody"></div></div></div>
<div class="toast" id="toast">.</div>

<script>
'use strict';
const TOOLNAME='fallrecruit',VERSION='1.0.0',PRIME=977,STORE='fallrecruit-v1';
const TABS=[{id:'dashboard',label:'dashboard'},{id:'candidates',label:'candidates'},{id:'clients',label:'clients'},{id:'vacancies',label:'vacancies'},{id:'placements',label:'placements'},{id:'compliance',label:'compliance'},{id:'qa',label:'Q&A'}];

const RULES={
  awrWeeks:12,
  conductRegsYear:2003,
  optOutCooling:7,
  wtrWeeks:0,
  minNoticeTempDays:0,
  transferFeeCapMonths:8,
  maxPermFeePercent:30,
  hmrcRTIDeadline:19,
};

let state={active:'dashboard',firm:null,candidates:[],clients:[],vacancies:[],placements:[],audit:[],
  ui:{chat:[]},settings:{anthropicKey:'',auditChain:true}};

const $=(s,p=document)=>p.querySelector(s);const uid=p=>(p||'')+'_'+Math.random().toString(36).slice(2,11);const now=()=>Date.now();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{const v=Number(n);return isNaN(v)?'—':'£'+v.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})};
const dateStr=ts=>{if(!ts)return '—';return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),1900)}
async function sha256(s){const buf=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}

let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(STORE,1);r.onupgradeneeded=e=>{const d=e.target.result;['state','audit','firms','candidates','clients','vacancies','placements'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='state'?undefined:'id'})})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=rej})}
function idbGetAll(s){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}
function idbGet(s,k){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}
function idbPut(s,v,k){return new Promise(res=>{const tx=db.transaction(s,'readwrite');const o=tx.objectStore(s);const q=k!=null?o.put(v,k):o.put(v);q.onsuccess=()=>res(true);q.onerror=()=>res(false)})}
async function loadAll(){if(!db)await openDB();const[firms,cands,cls,vacs,plcs,auditArr,uiState]=await Promise.all([idbGetAll('firms'),idbGetAll('candidates'),idbGetAll('clients'),idbGetAll('vacancies'),idbGetAll('placements'),idbGetAll('audit'),idbGet('state','ui')]);state.firm=firms[0]||null;state.candidates=cands;state.clients=cls;state.vacancies=vacs;state.placements=plcs;state.audit=auditArr.sort((a,b)=>a.i-b.i);if(uiState){state.ui=Object.assign({},state.ui,uiState.value||{});state.settings=Object.assign({},state.settings,uiState.settings||{})}}
async function persistUI(){await idbPut('state',{value:{...state.ui},settings:state.settings},'ui')}
// ⚑ The writer now shares ONE layout with verifyAudit(), so they cannot drift apart.
async function auditLog(action,opts={}){
  if(!state.settings.auditChain)return;
  const prev=state.audit.length?state.audit[state.audit.length-1]:null;
  const sealed=await AUDITCHAIN.append(state.audit,{id:uid('au'),i:(prev?prev.i:0)+1,ts:now(),tool:TOOLNAME,action,reasoning:opts.reasoning||'',configVersion:TOOLNAME+'@'+VERSION,payload:opts.payload||{}});
  state.audit.push(sealed);await idbPut('audit',sealed);
}
// The check that never existed anywhere in this tool.
async function verifyAudit(expectHead){return AUDITCHAIN.verify(state.audit,expectHead?{expectHead}:null)}

let bcRecruit,bcSignal;
function initMesh(){try{bcSignal=new BroadcastChannel('fall-signal');bcSignal.postMessage({source:TOOLNAME,type:'hello',prime:PRIME,version:VERSION,ts:now()})}catch(e){}try{bcRecruit=new BroadcastChannel('fall-recruit');bcRecruit.addEventListener('message',async e=>{const m=e.data;if(!m||m.source===TOOLNAME)return;if(m.type==='sync.snapshot'){const p=m.payload||{};if(Array.isArray(p.candidates))for(const c of p.candidates){if(!state.candidates.find(x=>x.id===c.id)){state.candidates.push(c);await idbPut('candidates',c)}}if(Array.isArray(p.clients))for(const c of p.clients){if(!state.clients.find(x=>x.id===c.id)){state.clients.push(c);await idbPut('clients',c)}}if(p.firm&&!state.firm){state.firm=p.firm;await idbPut('firms',p.firm)}render()}});bcRecruit.postMessage({v:1,type:'sync.request',ts:now(),source:TOOLNAME})}catch(e){}}

function totalPlacements(){return state.placements.length}
function activePlacements(){return state.placements.filter(p=>p.status==='active').length}
function totalFees(){return state.placements.reduce((s,p)=>s+Number(p.fee||0),0)}
function totalInvoiced(){return state.placements.filter(p=>p.invoiced).reduce((s,p)=>s+Number(p.fee||0),0)}
function totalOutstanding(){return totalFees()-totalInvoiced()}
function openVacancies(){return state.vacancies.filter(v=>v.status==='open').length}
function awrDueCount(){return state.placements.filter(p=>{if(p.type!=='temporary'||p.status!=='active')return false;if(!p.startDate)return false;const start=new Date(p.startDate);const weeks=(now()-start.getTime())/(7*24*60*60*1000);return weeks>=RULES.awrWeeks-2&&weeks<RULES.awrWeeks}).length}

function render(){$('#tabNav').innerHTML=TABS.map(t=>`<button class="${state.active===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('');const v=$('#view');switch(state.active){case 'dashboard':return renderDashboard(v);case 'candidates':return renderCandidates(v);case 'clients':return renderClients(v);case 'vacancies':return renderVacancies(v);case 'placements':return renderPlacements(v);case 'compliance':return renderCompliance(v);case 'qa':return renderQA(v)}}
function switchTab(id){state.active=id;persistUI();render()}

function renderDashboard(v){v.innerHTML=`<div class="disclaimer"><strong>◊ Regulatory notice:</strong> FallRecruit is shaped by the Employment Agencies Act 1973, Conduct of Employment Agencies and Employment Businesses Regulations 2003, Agency Workers Regulations 2010, and HMRC off-payroll (IR35) rules. All employment decisions remain the agency's responsibility. Data never leaves this device.</div><div class="section-h"><h2>Dashboard</h2><div class="sub">${state.firm?.name||'set up agency'}</div></div><div class="kpi-grid"><div class="kpi"><div class="label">Candidates</div><div class="val">${state.candidates.length}</div></div><div class="kpi"><div class="label">Clients</div><div class="val">${state.clients.length}</div></div><div class="kpi"><div class="label">Open vacancies</div><div class="val">${openVacancies()}</div></div><div class="kpi"><div class="label">Active placements</div><div class="val">${activePlacements()}</div></div><div class="kpi"><div class="label">Total fees</div><div class="val">${fmt(totalFees())}</div></div><div class="kpi"><div class="label">Invoiced</div><div class="val">${fmt(totalInvoiced())}</div></div><div class="kpi"><div class="label">Outstanding</div><div class="val" style="color:${totalOutstanding()>0?'var(--amber)':'var(--green)'};">${fmt(totalOutstanding())}</div></div><div class="kpi"><div class="label">AWR approaching</div><div class="val" style="color:${awrDueCount()>0?'var(--red)':'var(--green)'};">${awrDueCount()}</div><div class="hint">${RULES.awrWeeks}-week threshold</div></div></div>`}

function renderCandidates(v){v.innerHTML=`<div class="section-h"><h2>Candidates</h2><div class="sub">${state.candidates.length}</div><div class="actions"><button class="btn brass sm" onclick="openModal('addCandidate')">+ Candidate</button></div></div>${state.candidates.length?`<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Sector</th><th>Status</th><th>RTW</th><th>DBS</th></tr></thead><tbody>${state.candidates.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td>${esc(c.sector)}</td><td><span class="pill ${c.status==='available'?'green':c.status==='placed'?'blue':'amber'}">${c.status}</span></td><td><span class="pill ${c.rtw?'green':'red'}">${c.rtw?'✓':'✗'}</span></td><td>${esc(c.dbsDate||'—')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No candidates. Add candidates or sync from fallrecruitonboard.</div>'}`}

function renderClients(v){v.innerHTML=`<div class="section-h"><h2>Clients</h2><div class="sub">${state.clients.length}</div><div class="actions"><button class="btn brass sm" onclick="openModal('addClient')">+ Client</button></div></div>${state.clients.length?`<table><thead><tr><th>Company</th><th>Contact</th><th>Email</th><th>Sector</th><th>Terms</th><th>Vacancies</th></tr></thead><tbody>${state.clients.map(c=>{const vCount=state.vacancies.filter(v=>v.clientId===c.id).length;return `<tr><td>${esc(c.company)}</td><td>${esc(c.contact)}</td><td>${esc(c.email)}</td><td>${esc(c.sector)}</td><td>${esc(c.termsType||'—')}</td><td>${vCount}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No clients.</div>'}`}

function renderVacancies(v){v.innerHTML=`<div class="section-h"><h2>Vacancies</h2><div class="sub">${openVacancies()} open / ${state.vacancies.length} total</div><div class="actions"><button class="btn brass sm" onclick="openModal('addVacancy')">+ Vacancy</button></div></div>${state.vacancies.length?`<table><thead><tr><th>Title</th><th>Client</th><th>Type</th><th>Rate/Salary</th><th>Status</th><th>IR35</th><th>Candidates</th></tr></thead><tbody>${state.vacancies.sort((a,b)=>(b.ts||0)-(a.ts||0)).map(vc=>{const cl=state.clients.find(c=>c.id===vc.clientId);return `<tr><td>${esc(vc.title)}</td><td>${esc(cl?.company||vc.clientId?.slice(0,8)||'—')}</td><td><span class="pill ${vc.type==='permanent'?'blue':'amber'}">${vc.type}</span></td><td>${vc.type==='permanent'?fmt(vc.salary):fmt(vc.dayRate)+'/day'}</td><td><span class="pill ${vc.status==='open'?'green':vc.status==='filled'?'blue':'red'}">${vc.status}</span></td><td>${vc.type==='temporary'||vc.type==='contract'?esc(vc.ir35||'TBD'):'n/a'}</td><td>${vc.candidateCount||0}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No vacancies.</div>'}`}

function renderPlacements(v){v.innerHTML=`<div class="section-h"><h2>Placements</h2><div class="sub">${activePlacements()} active / ${totalPlacements()} total</div><div class="actions"><button class="btn brass sm" onclick="openModal('addPlacement')">+ Placement</button></div></div>${state.placements.length?`<table><thead><tr><th>Candidate</th><th>Client</th><th>Role</th><th>Type</th><th>Start</th><th>Status</th><th>AWR wk</th><th class="num">Fee</th><th>Invoiced</th></tr></thead><tbody>${state.placements.sort((a,b)=>(b.ts||0)-(a.ts||0)).map(p=>{let awrWk='—';if((p.type==='temporary'||p.type==='contract')&&p.startDate){const w=Math.floor((now()-new Date(p.startDate).getTime())/(7*24*60*60*1000));awrWk=w;if(w>=RULES.awrWeeks)awrWk=`<span style="color:var(--red);font-weight:700">${w} ⚠</span>`}return `<tr><td>${esc(p.candidateName)}</td><td>${esc(p.clientName)}</td><td>${esc(p.role)}</td><td><span class="pill ${p.type==='permanent'?'blue':'amber'}">${p.type}</span></td><td>${esc(p.startDate)}</td><td><span class="pill ${p.status==='active'?'green':p.status==='completed'?'blue':'red'}">${p.status}</span></td><td>${awrWk}</td><td class="num">${fmt(p.fee)}</td><td><span class="pill ${p.invoiced?'green':'amber'}">${p.invoiced?'yes':'no'}</span></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No placements.</div>'}`}

function renderCompliance(v){const checks=[
  {id:'eaa',name:'Employment Agencies Act 1973 compliance',cat:'Core',desc:'Agency registered. No charging work-seekers for finding work (s.6). Terms agreed before services.'},
  {id:'conduct2003',name:'Conduct of Employment Agencies Regulations 2003',cat:'Core',desc:'Written terms to hirers and work-seekers. Suitability checks. Opt-out records. Record keeping 1 year (Reg 29).'},
  {id:'awr',name:'Agency Workers Regulations 2010 compliance',cat:'AWR',desc:'After 12 qualifying weeks: equal pay, working time, facilities. Swedish Derogation abolished April 2020.'},
  {id:'ir35',name:'IR35 / Off-payroll status determinations',cat:'Tax',desc:'Client responsibility (medium/large). SDS issued, right to appeal, reasonable care. CEST tool recommended.'},
  {id:'rtw',name:'Right to Work checks documented',cat:'Immigration',desc:'Immigration, Asylum and Nationality Act 2006. Check before engagement starts. Retain copies 2 years after end.'},
  {id:'dbs',name:'DBS checks (where applicable)',cat:'Safeguarding',desc:'Regulated activity roles: enhanced DBS. Update Service checks. Portability between agencies limited.'},
  {id:'gdpr',name:'GDPR/Data Protection Act 2018 compliance',cat:'Data',desc:'Privacy notices, lawful basis (consent/legitimate interest), data retention policy, candidate data rights (access/erasure/portability).'},
  {id:'hmrc',name:'HMRC PAYE/RTI for temp workers',cat:'Tax',desc:'Operate PAYE for agency workers unless genuinely self-employed or inside PSC. RTI submissions by 19th. Holiday pay calculations.'},
  {id:'insurance',name:'Professional indemnity + public liability',cat:'Insurance',desc:'PI insurance for recruitment advice. PL if placing workers on client sites. Employers liability for temps on agency payroll.'},
  {id:'complaints',name:'Complaints procedure in place',cat:'Governance',desc:'Written complaints procedure accessible to candidates and clients. EAS (Employment Agency Standards Inspectorate) can investigate.'},
  {id:'optout',name:'Opt-out records maintained',cat:'Conduct',desc:'Conduct Regs 2003 Reg 10: work-seeker may opt out of certain provisions. Opt-out must be in writing, cooling-off period '+RULES.optOutCooling+' days.'},
  {id:'equalops',name:'Equal opportunities / anti-discrimination',cat:'Equality',desc:'Equality Act 2010: cannot discriminate in providing recruitment services. Reasonable adjustments. Monitor and report.'},
];
  const done=state.ui.compChecks||[];
  v.innerHTML=`<div class="section-h"><h2>Compliance</h2><div class="sub">${done.length}/${checks.length}</div></div><div style="display:flex;flex-direction:column;gap:6px">${checks.map(c=>{const isDone=done.includes(c.id);return `<div class="card" style="cursor:pointer;padding:12px 16px;${isDone?'opacity:0.6':''}" onclick="toggleComp('${c.id}')"><div style="display:flex;gap:10px;align-items:flex-start"><span style="font-size:16px;flex-shrink:0;width:20px">${isDone?'<span style="color:var(--green)">✓</span>':'○'}</span><div><strong>${esc(c.name)}</strong><div style="font-size:11px;color:var(--cream-muted);margin-top:2px">${esc(c.cat)} · ${esc(c.desc)}</div></div></div></div>`}).join('')}</div>`}
async function toggleComp(id){if(!state.ui.compChecks)state.ui.compChecks=[];const idx=state.ui.compChecks.indexOf(id);if(idx>=0)state.ui.compChecks.splice(idx,1);else state.ui.compChecks.push(id);await persistUI();await auditLog('compliance.toggle',{payload:{id}});render()}

const T0_QA=[
  {q:/conduct|regulation|2003|terms/i,a:'Conduct of Employment Agencies and Employment Businesses Regulations 2003: agencies must agree written terms with hirers AND work-seekers before providing services. Terms must include: fees/charges, notice periods, payment details, opt-out provisions. Records retained for at least 1 year after last provision of services. Employment businesses (temps) must also confirm: pay rate, holiday entitlement, length of assignment, expenses.'},
  {q:/awr|agency.?worker|12.?week|equal/i,a:'Agency Workers Regulations 2010 (AWR): after 12 qualifying weeks in the same role with the same hirer, agency workers are entitled to: equal pay (basic pay, overtime, shift allowances, bonuses, commission, holiday pay), equal access to facilities (canteen, transport, childcare), information about vacancies. Swedish Derogation (pay-between-assignments contracts) abolished 6 April 2020. Anti-avoidance: structuring assignments to prevent qualifying is unlawful.'},
  {q:/ir35|off.?payroll|sds|status|inside|outside/i,a:'Off-payroll working (IR35): since April 2021 (private sector) and April 2017 (public), medium/large end-clients determine employment status for tax (Status Determination Statement). Agency must: pass SDS to worker, deduct tax/NI if inside IR35, allow worker to appeal. HMRC CEST tool recommended (not conclusive). Small company exemption: PSC self-assesses. Factors: control, substitution, mutuality of obligation.'},
  {q:/rtw|right.?to.?work|immigration|visa/i,a:'Immigration, Asylum and Nationality Act 2006: agencies must verify Right to Work before engagement. Acceptable documents: UK/Irish passport, share code from gov.uk, BRP (biometric residence permit), valid visa. Keep copies for duration of employment + 2 years after termination. Online RTW checks via gov.uk share code for non-UK nationals. Civil penalty up to £45,000 per illegal worker (2024 rates). Repeat offence: criminal prosecution.'},
  {q:/fee|charge|transfer|temp.?to.?perm/i,a:'Conduct Regulations 2003: employment businesses cannot charge work-seekers for finding work. Hirer fees: temp-to-perm fees capped at reasonable amount. Extended hire period (transfer fee alternative): max '+RULES.transferFeeCapMonths+' months. After that, no transfer fee. Perm agency fees: typically 15-25% of annual salary, agreed in terms of business. Fee rebate schedules common (pro-rata refund if candidate leaves within guarantee period).'},
  {q:/gdpr|data|privacy|retention/i,a:'UK GDPR / Data Protection Act 2018: lawful basis required for processing candidate data — typically consent (job applications) or legitimate interest (proactive sourcing). Privacy notice required before processing. Data retention: active candidates — duration of relationship + reasonable period; unsuccessful applicants — typically 6-12 months. Rights: access, rectification, erasure, portability. Special category data (disability, health) — explicit consent required. ICO registration mandatory.'},
  {q:/holiday|wtr|working.?time|pay/i,a:'Working Time Regulations 1998: agency workers entitled to 5.6 weeks paid annual leave (28 days for full-time). Holiday pay: calculated on average earnings over 52-week reference period. Rolled-up holiday pay: permitted since January 2024 (Employment Rights (Amendment, Revocation and Transitional Provision) Regulations 2023). Agency must clearly show holiday pay element on payslip if using rolled-up method.'},

// ════════════════════════════════════════════════════════════════
// THE GATED AUDIT CHAIN — inlined verbatim by build-page.mjs: the shared kernel from fallhardened
// plus this repo's own byte layout.
//
// ⚑ SCOPED IN A CLOSURE. The kernel exports names the app also uses; left at top level a later
// declaration would silently win and every call site would be passing the wrong arguments to a
// function that still looked right.
// Do not edit between the markers: edit audit.mjs, re-run the gate, rebuild the page.
// ════════════════════════════════════════════════════════════════
const AUDITCHAIN=(function(){
/* __AUDIT_KERNEL__ */
// audit-chain.mjs — a tamper-evident log that can actually be checked.
//
// ⚑ WHY THIS EXISTS. Nine tools in this estate write a hash-linked audit log — clinic, vet, HR,
// recruitment, claims, legal, insurance, books, practice — and not one of them ever re-walked it.
// prevHash and docHash were written on every action and never read back, so the tamper-evidence was
// a claim about the data rather than a property of it. A regulator asking "prove this was not edited"
// would have been handed a log that could not answer.
//
// ⚑ AND WHY IT IS A FACTORY. The bug underneath the bug is that a writer and a verifier can disagree
// about WHICH BYTES were signed, and then a check passes that should not — or fails when nothing is
// wrong. Here both come out of one call and close over the same `payloadOf`, so they cannot drift.
// You cannot construct a verifier for one layout and a writer for another by accident.
//
// The byte layout itself is deliberately NOT fixed: the nine tools each sign different fields, and
// forcing one shape would either break their existing logs or quietly re-define what was signed.

/** The hash a chain starts from. An empty string, so the first entry has nothing behind it. */
const GENESIS = '';

const isFn = (f) => typeof f === 'function';

/**
 * Build a chain that can write and check its own entries.
 *
 * @param opts.sha256    async (string) => hex digest. Injected so this stays pure and testable.
 * @param opts.payloadOf (prevHash, entry, index) => string — exactly the bytes that get signed.
 *                   May return a promise: one tool in this estate hashes the payload first and signs
 *                   THAT, so the layout itself needs to await a digest.
 * @param opts.hashField which field on an entry holds the chain hash. Default "docHash". One tool
 *                   keeps two hashes — a docHash over the payload and a separate `hash` for the
 *                   link — so the field cannot be assumed.
 */
function auditChain(opts) {
  // A default parameter does not fire on an explicit null, and null is what a caller reading a
  // missing config hands you. Normalise, then read.
  const o = (opts && typeof opts === 'object') ? opts : {};
  const sha256 = o.sha256;
  const payloadOf = o.payloadOf;
  const hashField = (typeof o.hashField === 'string' && o.hashField) ? o.hashField : 'docHash';
  // ⚑ NOT EVERY CHAIN STARTS AT THE EMPTY STRING. One tool in this estate opens its log with 64
  // zeros. Assuming genesis would make its very first entry fail to verify, for ever.
  const genesis = (typeof o.genesis === 'string') ? o.genesis : GENESIS;
  if (!isFn(sha256)) throw new Error('auditChain needs a sha256(string) function');
  if (!isFn(payloadOf)) throw new Error('auditChain needs a payloadOf(prevHash, entry, index) function');

  /**
   * The hash the next entry must link to.
   *
   * The last row is read defensively because a corrupt log is exactly when this gets called: a null
   * or non-object at the end used to throw here, which turned "your audit log has a bad row" into
   * "the app crashed while trying to write an audit entry".
   */
  function headOf(entries) {
    const log = Array.isArray(entries) ? entries : [];
    if (!log.length) return genesis;
    const last = log[log.length - 1];
    if (!last || typeof last !== 'object') return genesis;
    return String(last[hashField] ?? '');
  }

  /**
   * Seal an entry onto the end of the log. Returns a NEW entry carrying prevHash and docHash —
   * it does not mutate what it was given, because an audit writer that edits its input is the
   * first thing anyone should distrust.
   */
  async function append(entries, entry) {
    const log = Array.isArray(entries) ? entries : [];
    const prevHash = headOf(log);
    // ⚑ RESPECT THE CALLER'S NUMBERING. These tools number entries from 1 and SIGN that number.
    // Overwriting it with a zero-based position would renumber every new entry and quietly change
    // what gets hashed.
    const given = (entry && typeof entry === 'object') ? entry.i : undefined;
    const i = Number.isFinite(given) ? given : log.length;
    const base = { ...(entry && typeof entry === 'object' ? entry : {}), i, prevHash };
    // ⚑ THE THIRD ARGUMENT IS THE POSITION IN THE LOG, NOT THE ENTRY'S OWN NUMBER. verify() walks the
    // array and passes the array index, so append must pass the same thing or a one-based log signs
    // one value and verifies against another — every entry written would fail its own check.
    // A layout that wants the entry's number reads it off the entry, where it lives.
    const pos = log.length;
    // await, because a layout may itself need to hash something before it can say what is signed.
    const digest = await sha256(await payloadOf(prevHash, base, pos));
    return { ...base, [hashField]: digest };
  }

  /**
   * Walk the log and report the FIRST entry that does not reproduce. The earliest break is when the
   * tampering happened; everything after it is just that break's wake, so reporting later ones would
   * bury the answer.
   *
   * `expectHead` is optional and closes the one hole a chain cannot close on its own — see below.
   */
  async function verify(entries, checkOpts) {
    const log = Array.isArray(entries) ? entries : [];
    const c = (checkOpts && typeof checkOpts === 'object') ? checkOpts : {};
    let prev = genesis;

    for (let i = 0; i < log.length; i++) {
      const e = (log[i] && typeof log[i] === 'object') ? log[i] : {};
      if (String(e.prevHash ?? '') !== prev) {
        return { ok: false, brokeAt: i, id: e.id ?? null, entries: log.length,
                 reason: 'this entry does not link to the one before it — something was inserted, removed or reordered' };
      }
      const expected = await sha256(await payloadOf(prev, e, i));
      if (expected !== e[hashField]) {
        return { ok: false, brokeAt: i, id: e.id ?? null, entries: log.length,
                 reason: 'this entry was altered after it was written' };
      }
      prev = e[hashField];
    }

    // ⚑ THE HONEST BOUND. A chain proves nothing was changed or removed from the MIDDLE. Delete the
    // last few entries and what remains is a perfectly valid chain — the log simply looks shorter.
    // The only defence is knowing what the head should be, from somewhere the editor could not reach.
    // Without expectHead this returns ok:true and SAYS the tail is unproven, rather than implying a
    // completeness it cannot demonstrate.
    if (c.expectHead != null) {
      if (String(c.expectHead) !== prev) {
        return { ok: false, brokeAt: log.length, id: null, entries: log.length,
                 reason: 'the log ends earlier than it should — entries were removed from the end' };
      }
      return { ok: true, entries: log.length, tailProven: true,
               reason: 'every entry reproduces its own hash, and the log ends where it was expected to' };
    }

    return {
      ok: true, entries: log.length, tailProven: false,
      reason: log.length
        ? 'every entry reproduces its own hash — but nothing here can prove entries were not removed from the END; keep the head hash somewhere separate to close that'
        : 'the log is empty',
    };
  }

  return { append, verify, headOf, payloadOf };
}


// audit.mjs — fallrecruit's audit layout, and the chain built from it.
//
// ⚑ THE BYTES MUST NOT CHANGE. There are logs in the wild signed by the old inline writer. If this
// layout differs by one character, every entry a firm has already written stops reproducing and the
