<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>◊ FallRecruit · sovereign UK recruitment agency management · candidates · clients · placements · compliance · AWR · IR35</title>
<meta name="description" content="Sovereign recruitment agency management for UK agencies. Candidates, clients, vacancies, placements, compliance (AWR, IR35, Conduct Regulations 2003). Single HTML, IDB primary, MIT.">
<meta name="prime" content="977">
<meta name="theme-color" content="#0b0a0f">
<link rel="manifest" href='data:application/manifest+json,{"name":"FallRecruit","short_name":"recruit","start_url":"./","display":"standalone","background_color":"%230b0a0f","theme_color":"%23b8974a","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27><rect width=%27192%27 height=%27192%27 fill=%27%230b0a0f%27 rx=%2728%27/><text x=%2796%27 y=%27140%27 font-family=%27Georgia, serif%27 font-size=%27122%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%23b8974a%27>%E2%97%8A</text></svg>","sizes":"192x192","type":"image/svg+xml"}]}'>
<style>
:root{--void:#0b0a0f;--void-2:#13121a;--ink:#1a1922;--ink-2:#22212c;--line:#2a2934;--line-soft:#1f1e28;--cream:#e6e1d6;--cream-dim:#a8a395;--cream-muted:#6e6a5e;--brass:#b8974a;--amber:#ff8c00;--ox:#8b1a1a;--green:#4ade80;--red:#ef4444;--blue:#60a5fa;--yellow:#fbbf24;--serif:Georgia,'Libre Baskerville',ui-serif,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace}
*{margin:0;padding:0;box-sizing:border-box}html,body{background:var(--void);color:var(--cream);font:14px/1.55 var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;background:transparent;border:none;color:inherit}input,textarea,select{font-family:inherit;background:var(--ink);border:1px solid var(--line);color:var(--cream);border-radius:3px;padding:7px 10px;outline:none;font-size:13px}input:focus,textarea:focus,select:focus{border-color:var(--brass)}a{color:var(--brass)}
.app{min-height:100dvh;display:grid;grid-template-rows:48px 1fr}header{display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--void-2);user-select:none}.brand{display:flex;align-items:center;gap:10px;padding:0 16px;height:100%;border-right:1px solid var(--line)}.brand .mark{width:28px;height:28px;background:linear-gradient(135deg,var(--brass),var(--amber));border-radius:5px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--void)}.brand .name{font-family:var(--serif);font-weight:600;font-size:14px}.brand .seal{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.18em;text-transform:uppercase}
nav.tabs{display:flex;flex:1;overflow-x:auto;align-items:stretch}nav.tabs button{padding:0 14px;font-size:12px;color:var(--cream-dim);letter-spacing:0.04em;display:flex;align-items:center;border-right:1px solid var(--line-soft);height:100%;white-space:nowrap;border-top:2px solid transparent}nav.tabs button:hover{background:var(--ink);color:var(--cream)}nav.tabs button.active{background:var(--ink);color:var(--brass);border-top-color:var(--brass)}
.tools-r{display:flex;align-items:center;gap:5px;padding:0 14px;height:100%;border-left:1px solid var(--line)}.tool-btn{padding:5px 11px;border-radius:3px;font-size:11px;color:var(--cream-dim);letter-spacing:0.06em;text-transform:uppercase;font-family:var(--mono);border:1px solid var(--line)}.tool-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--brass)}
main{padding:18px 22px 60px;overflow-y:auto;max-width:1200px;margin:0 auto;width:100%}
.disclaimer{background:rgba(139,26,26,0.15);border:1px solid var(--ox);border-left:3px solid var(--ox);border-radius:3px;padding:12px 16px;margin-bottom:18px;font-size:12px}.disclaimer strong{color:var(--brass)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:14px;flex-wrap:wrap}.section-h h2{font-family:var(--serif);font-size:18px;font-weight:600}.section-h .sub{font-family:var(--mono);font-size:11px;color:var(--cream-muted);letter-spacing:0.08em;text-transform:uppercase}.section-h .actions{display:flex;gap:6px}
.card{background:var(--void-2);border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:14px}.card h3{font-family:var(--serif);font-size:14px;font-weight:600;margin-bottom:10px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:18px}.kpi{background:var(--void-2);border:1px solid var(--line);border-radius:4px;padding:14px 16px}.kpi .label{font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px}.kpi .val{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--brass)}.kpi .hint{font-size:11px;color:var(--cream-muted);margin-top:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.field label{display:block;font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px}.field input,.field select,.field textarea{width:100%}
.btn{padding:7px 14px;border:1px solid var(--brass);border-radius:3px;font-size:12px;color:var(--cream);background:transparent}.btn:hover{border-color:var(--amber);color:var(--amber)}.btn.brass{background:var(--brass);color:var(--void);border-color:var(--brass);font-weight:600}.btn.brass:hover{background:var(--amber)}.btn.sm{padding:4px 9px;font-size:11px}.btn.ghost{border-color:var(--line);color:var(--cream-dim)}.btn.danger:hover{border-color:var(--red);color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}th,td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}th{color:var(--brass);font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600}td.num{text-align:right;font-family:var(--mono);font-size:12px}th.num{text-align:right}
.pill{display:inline-block;padding:2px 7px;border-radius:11px;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid var(--brass);color:var(--brass)}.pill.green{border-color:var(--green);color:var(--green)}.pill.red{border-color:var(--red);color:var(--red)}.pill.amber{border-color:var(--amber);color:var(--amber)}.pill.blue{border-color:var(--blue);color:var(--blue)}
.empty{padding:24px;text-align:center;color:var(--cream-muted);font-style:italic;font-size:12px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding:6px}.msg{padding:10px 14px;border-radius:6px;max-width:88%;font-size:13px;line-height:1.55;white-space:pre-wrap}.msg.user{background:var(--ink);align-self:flex-end}.msg.bot{background:var(--void-2);border:1px solid var(--line);border-left:2px solid var(--brass);align-self:flex-start}.msg .src{font-family:var(--mono);font-size:10px;color:var(--cream-muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}.chat-input{display:flex;gap:8px;margin-top:10px}.chat-input input{flex:1;padding:11px 14px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;padding:18px;z-index:900;backdrop-filter:blur(4px)}.modal-bg.open{display:flex}.modal{background:var(--void-2);border:1px solid var(--brass);border-radius:4px;padding:22px;max-width:700px;width:100%;max-height:90vh;overflow:auto}.modal h2{font-family:var(--serif);font-size:17px;margin-bottom:14px}.modal .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brass);color:var(--void);padding:9px 18px;border-radius:3px;font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;opacity:0;transition:all 0.22s;z-index:1100;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){nav.tabs button{padding:0 10px;font-size:11px}main{padding:14px 14px 50px}.row{grid-template-columns:1fr}.kpi-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="mark">◊</div><div><div class="name">FallRecruit</div></div><div class="seal">v1 · prime 977</div></div>
  <nav class="tabs" id="tabNav"></nav>
  <div class="tools-r"><button class="tool-btn" id="tierBadge" onclick="openModal('settings')">T0</button><button class="tool-btn" onclick="openModal('settings')">⚙</button></div>
</header>
<main id="view"></main>
</div>
<div class="modal-bg" id="modal"><div class="modal"><h2 id="modalTitle">.</h2><div id="modalBody"></div></div></div>
<div class="toast" id="toast">.</div>

<script>
'use strict';
const TOOLNAME='fallrecruit',VERSION='1.0.0',PRIME=977,STORE='fallrecruit-v1';
const TABS=[{id:'dashboard',label:'dashboard'},{id:'candidates',label:'candidates'},{id:'clients',label:'clients'},{id:'vacancies',label:'vacancies'},{id:'placements',label:'placements'},{id:'compliance',label:'compliance'},{id:'qa',label:'Q&A'}];

const RULES={
  awrWeeks:12,
  conductRegsYear:2003,
  optOutCooling:7,
  wtrWeeks:0,
  minNoticeTempDays:0,
  transferFeeCapMonths:8,
  maxPermFeePercent:30,
  hmrcRTIDeadline:19,
};

let state={active:'dashboard',firm:null,candidates:[],clients:[],vacancies:[],placements:[],audit:[],
  ui:{chat:[]},settings:{anthropicKey:'',auditChain:true}};

const $=(s,p=document)=>p.querySelector(s);const uid=p=>(p||'')+'_'+Math.random().toString(36).slice(2,11);const now=()=>Date.now();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{const v=Number(n);return isNaN(v)?'—':'£'+v.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})};
const dateStr=ts=>{if(!ts)return '—';return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),1900)}
async function sha256(s){const buf=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}

let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(STORE,1);r.onupgradeneeded=e=>{const d=e.target.result;['state','audit','firms','candidates','clients','vacancies','placements'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='state'?undefined:'id'})})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=rej})}
function idbGetAll(s){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}
function idbGet(s,k){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}
function idbPut(s,v,k){return new Promise(res=>{const tx=db.transaction(s,'readwrite');const o=tx.objectStore(s);const q=k!=null?o.put(v,k):o.put(v);q.onsuccess=()=>res(true);q.onerror=()=>res(false)})}
async function loadAll(){if(!db)await openDB();const[firms,cands,cls,vacs,plcs,auditArr,uiState]=await Promise.all([idbGetAll('firms'),idbGetAll('candidates'),idbGetAll('clients'),idbGetAll('vacancies'),idbGetAll('placements'),idbGetAll('audit'),idbGet('state','ui')]);state.firm=firms[0]||null;state.candidates=cands;state.clients=cls;state.vacancies=vacs;state.placements=plcs;state.audit=auditArr.sort((a,b)=>a.i-b.i);if(uiState){state.ui=Object.assign({},state.ui,uiState.value||{});state.settings=Object.assign({},state.settings,uiState.settings||{})}}
async function persistUI(){await idbPut('state',{value:{...state.ui},settings:state.settings},'ui')}
async function auditLog(action,opts={}){if(!state.settings.auditChain)return;const prev=state.audit.length?state.audit[state.audit.length-1]:null;const i=(prev?prev.i:0)+1;const entry={id:uid('au'),i,ts:now(),tool:TOOLNAME,action,reasoning:opts.reasoning||'',configVersion:TOOLNAME+'@'+VERSION,prevHash:prev?.docHash||'',docHash:'',payload:opts.payload||{}};entry.docHash=await sha256(JSON.stringify({i,ts:entry.ts,action,prevHash:entry.prevHash,payload:entry.payload}));state.audit.push(entry);await idbPut('audit',entry)}

let bcRecruit,bcSignal;
function initMesh(){try{bcSignal=new BroadcastChannel('fall-signal');bcSignal.postMessage({source:TOOLNAME,type:'hello',prime:PRIME,version:VERSION,ts:now()})}catch(e){}try{bcRecruit=new BroadcastChannel('fall-recruit');bcRecruit.addEventListener('message',async e=>{const m=e.data;if(!m||m.source===TOOLNAME)return;if(m.type==='sync.snapshot'){const p=m.payload||{};if(Array.isArray(p.candidates))for(const c of p.candidates){if(!state.candidates.find(x=>x.id===c.id)){state.candidates.push(c);await idbPut('candidates',c)}}if(Array.isArray(p.clients))for(const c of p.clients){if(!state.clients.find(x=>x.id===c.id)){state.clients.push(c);await idbPut('clients',c)}}if(p.firm&&!state.firm){state.firm=p.firm;await idbPut('firms',p.firm)}render()}});bcRecruit.postMessage({v:1,type:'sync.request',ts:now(),source:TOOLNAME})}catch(e){}}

function totalPlacements(){return state.placements.length}
function activePlacements(){return state.placements.filter(p=>p.status==='active').length}
function totalFees(){return state.placements.reduce((s,p)=>s+Number(p.fee||0),0)}
function totalInvoiced(){return state.placements.filter(p=>p.invoiced).reduce((s,p)=>s+Number(p.fee||0),0)}
function totalOutstanding(){return totalFees()-totalInvoiced()}
function openVacancies(){return state.vacancies.filter(v=>v.status==='open').length}
function awrDueCount(){return state.placements.filter(p=>{if(p.type!=='temporary'||p.status!=='active')return false;if(!p.startDate)return false;const start=new Date(p.startDate);const weeks=(now()-start.getTime())/(7*24*60*60*1000);return weeks>=RULES.awrWeeks-2&&weeks<RULES.awrWeeks}).length}

function render(){$('#tabNav').innerHTML=TABS.map(t=>`<button class="${state.active===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('');const v=$('#view');switch(state.active){case 'dashboard':return renderDashboard(v);case 'candidates':return renderCandidates(v);case 'clients':return renderClients(v);case 'vacancies':return renderVacancies(v);case 'placements':return renderPlacements(v);case 'compliance':return renderCompliance(v);case 'qa':return renderQA(v)}}
function switchTab(id){state.active=id;persistUI();render()}

function renderDashboard(v){v.innerHTML=`<div class="disclaimer"><strong>◊ Regulatory notice:</strong> FallRecruit is shaped by the Employment Agencies Act 1973, Conduct of Employment Agencies and Employment Businesses Regulations 2003, Agency Workers Regulations 2010, and HMRC off-payroll (IR35) rules. All employment decisions remain the agency's responsibility. Data never leaves this device.</div><div class="section-h"><h2>Dashboard</h2><div class="sub">${state.firm?.name||'set up agency'}</div></div><div class="kpi-grid"><div class="kpi"><div class="label">Candidates</div><div class="val">${state.candidates.length}</div></div><div class="kpi"><div class="label">Clients</div><div class="val">${state.clients.length}</div></div><div class="kpi"><div class="label">Open vacancies</div><div class="val">${openVacancies()}</div></div><div class="kpi"><div class="label">Active placements</div><div class="val">${activePlacements()}</div></div><div class="kpi"><div class="label">Total fees</div><div class="val">${fmt(totalFees())}</div></div><div class="kpi"><div class="label">Invoiced</div><div class="val">${fmt(totalInvoiced())}</div></div><div class="kpi"><div class="label">Outstanding</div><div class="val" style="color:${totalOutstanding()>0?'var(--amber)':'var(--green)'};">${fmt(totalOutstanding())}</div></div><div class="kpi"><div class="label">AWR approaching</div><div class="val" style="color:${awrDueCount()>0?'var(--red)':'var(--green)'};">${awrDueCount()}</div><div class="hint">${RULES.awrWeeks}-week threshold</div></div></div>`}

function renderCandidates(v){v.innerHTML=`<div class="section-h"><h2>Candidates</h2><div class="sub">${state.candidates.length}</div><div class="actions"><button class="btn brass sm" onclick="openModal('addCandidate')">+ Candidate</button></div></div>${state.candidates.length?`<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Sector</th><th>Status</th><th>RTW</th><th>DBS</th></tr></thead><tbody>${state.candidates.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td>${esc(c.sector)}</td><td><span class="pill ${c.status==='available'?'green':c.status==='placed'?'blue':'amber'}">${c.status}</span></td><td><span class="pill ${c.rtw?'green':'red'}">${c.rtw?'✓':'✗'}</span></td><td>${esc(c.dbsDate||'—')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No candidates. Add candidates or sync from fallrecruitonboard.</div>'}`}

function renderClients(v){v.innerHTML=`<div class="section-h"><h2>Clients</h2><div class="sub">${state.clients.length}</div><div class="actions"><button class="btn brass sm" onclick="openModal('addClient')">+ Client</button></div></div>${state.clients.length?`<table><thead><tr><th>Company</th><th>Contact</th><th>Email</th><th>Sector</th><th>Terms</th><th>Vacancies</th></tr></thead><tbody>${state.clients.map(c=>{const vCount=state.vacancies.filter(v=>v.clientId===c.id).length;return `<tr><td>${esc(c.company)}</td><td>${esc(c.contact)}</td><td>${esc(c.email)}</td><td>${esc(c.sector)}</td><td>${esc(c.termsType||'—')}</td><td>${vCount}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No clients.</div>'}`}

function renderVacancies(v){v.innerHTML=`<div class="section-h"><h2>Vacancies</h2><div class="sub">${openVacancies()} open / ${state.vacancies.length} total</div><div class="actions"><button class="btn brass sm" onclick="openModal('addVacancy')">+ Vacancy</button></div></div>${state.vacancies.length?`<table><thead><tr><th>Title</th><th>Client</th><th>Type</th><th>Rate/Salary</th><th>Status</th><th>IR35</th><th>Candidates</th></tr></thead><tbody>${state.vacancies.sort((a,b)=>(b.ts||0)-(a.ts||0)).map(vc=>{const cl=state.clients.find(c=>c.id===vc.clientId);return `<tr><td>${esc(vc.title)}</td><td>${esc(cl?.company||vc.clientId?.slice(0,8)||'—')}</td><td><span class="pill ${vc.type==='permanent'?'blue':'amber'}">${vc.type}</span></td><td>${vc.type==='permanent'?fmt(vc.salary):fmt(vc.dayRate)+'/day'}</td><td><span class="pill ${vc.status==='open'?'green':vc.status==='filled'?'blue':'red'}">${vc.status}</span></td><td>${vc.type==='temporary'||vc.type==='contract'?esc(vc.ir35||'TBD'):'n/a'}</td><td>${vc.candidateCount||0}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No vacancies.</div>'}`}

function renderPlacements(v){v.innerHTML=`<div class="section-h"><h2>Placements</h2><div class="sub">${activePlacements()} active / ${totalPlacements()} total</div><div class="actions"><button class="btn brass sm" onclick="openModal('addPlacement')">+ Placement</button></div></div>${state.placements.length?`<table><thead><tr><th>Candidate</th><th>Client</th><th>Role</th><th>Type</th><th>Start</th><th>Status</th><th>AWR wk</th><th class="num">Fee</th><th>Invoiced</th></tr></thead><tbody>${state.placements.sort((a,b)=>(b.ts||0)-(a.ts||0)).map(p=>{let awrWk='—';if((p.type==='temporary'||p.type==='contract')&&p.startDate){const w=Math.floor((now()-new Date(p.startDate).getTime())/(7*24*60*60*1000));awrWk=w;if(w>=RULES.awrWeeks)awrWk=`<span style="color:var(--red);font-weight:700">${w} ⚠</span>`}return `<tr><td>${esc(p.candidateName)}</td><td>${esc(p.clientName)}</td><td>${esc(p.role)}</td><td><span class="pill ${p.type==='permanent'?'blue':'amber'}">${p.type}</span></td><td>${esc(p.startDate)}</td><td><span class="pill ${p.status==='active'?'green':p.status==='completed'?'blue':'red'}">${p.status}</span></td><td>${awrWk}</td><td class="num">${fmt(p.fee)}</td><td><span class="pill ${p.invoiced?'green':'amber'}">${p.invoiced?'yes':'no'}</span></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No placements.</div>'}`}

function renderCompliance(v){const checks=[
  {id:'eaa',name:'Employment Agencies Act 1973 compliance',cat:'Core',desc:'Agency registered. No charging work-seekers for finding work (s.6). Terms agreed before services.'},
  {id:'conduct2003',name:'Conduct of Employment Agencies Regulations 2003',cat:'Core',desc:'Written terms to hirers and work-seekers. Suitability checks. Opt-out records. Record keeping 1 year (Reg 29).'},
  {id:'awr',name:'Agency Workers Regulations 2010 compliance',cat:'AWR',desc:'After 12 qualifying weeks: equal pay, working time, facilities. Swedish Derogation abolished April 2020.'},
  {id:'ir35',name:'IR35 / Off-payroll status determinations',cat:'Tax',desc:'Client responsibility (medium/large). SDS issued, right to appeal, reasonable care. CEST tool recommended.'},
  {id:'rtw',name:'Right to Work checks documented',cat:'Immigration',desc:'Immigration, Asylum and Nationality Act 2006. Check before engagement starts. Retain copies 2 years after end.'},
  {id:'dbs',name:'DBS checks (where applicable)',cat:'Safeguarding',desc:'Regulated activity roles: enhanced DBS. Update Service checks. Portability between agencies limited.'},
  {id:'gdpr',name:'GDPR/Data Protection Act 2018 compliance',cat:'Data',desc:'Privacy notices, lawful basis (consent/legitimate interest), data retention policy, candidate data rights (access/erasure/portability).'},
  {id:'hmrc',name:'HMRC PAYE/RTI for temp workers',cat:'Tax',desc:'Operate PAYE for agency workers unless genuinely self-employed or inside PSC. RTI submissions by 19th. Holiday pay calculations.'},
  {id:'insurance',name:'Professional indemnity + public liability',cat:'Insurance',desc:'PI insurance for recruitment advice. PL if placing workers on client sites. Employers liability for temps on agency payroll.'},
  {id:'complaints',name:'Complaints procedure in place',cat:'Governance',desc:'Written complaints procedure accessible to candidates and clients. EAS (Employment Agency Standards Inspectorate) can investigate.'},
  {id:'optout',name:'Opt-out records maintained',cat:'Conduct',desc:'Conduct Regs 2003 Reg 10: work-seeker may opt out of certain provisions. Opt-out must be in writing, cooling-off period '+RULES.optOutCooling+' days.'},
  {id:'equalops',name:'Equal opportunities / anti-discrimination',cat:'Equality',desc:'Equality Act 2010: cannot discriminate in providing recruitment services. Reasonable adjustments. Monitor and report.'},
];
  const done=state.ui.compChecks||[];
  v.innerHTML=`<div class="section-h"><h2>Compliance</h2><div class="sub">${done.length}/${checks.length}</div></div><div style="display:flex;flex-direction:column;gap:6px">${checks.map(c=>{const isDone=done.includes(c.id);return `<div class="card" style="cursor:pointer;padding:12px 16px;${isDone?'opacity:0.6':''}" onclick="toggleComp('${c.id}')"><div style="display:flex;gap:10px;align-items:flex-start"><span style="font-size:16px;flex-shrink:0;width:20px">${isDone?'<span style="color:var(--green)">✓</span>':'○'}</span><div><strong>${esc(c.name)}</strong><div style="font-size:11px;color:var(--cream-muted);margin-top:2px">${esc(c.cat)} · ${esc(c.desc)}</div></div></div></div>`}).join('')}</div>`}
async function toggleComp(id){if(!state.ui.compChecks)state.ui.compChecks=[];const idx=state.ui.compChecks.indexOf(id);if(idx>=0)state.ui.compChecks.splice(idx,1);else state.ui.compChecks.push(id);await persistUI();await auditLog('compliance.toggle',{payload:{id}});render()}

const T0_QA=[
  {q:/conduct|regulation|2003|terms/i,a:'Conduct of Employment Agencies and Employment Businesses Regulations 2003: agencies must agree written terms with hirers AND work-seekers before providing services. Terms must include: fees/charges, notice periods, payment details, opt-out provisions. Records retained for at least 1 year after last provision of services. Employment businesses (temps) must also confirm: pay rate, holiday entitlement, length of assignment, expenses.'},
  {q:/awr|agency.?worker|12.?week|equal/i,a:'Agency Workers Regulations 2010 (AWR): after 12 qualifying weeks in the same role with the same hirer, agency workers are entitled to: equal pay (basic pay, overtime, shift allowances, bonuses, commission, holiday pay), equal access to facilities (canteen, transport, childcare), information about vacancies. Swedish Derogation (pay-between-assignments contracts) abolished 6 April 2020. Anti-avoidance: structuring assignments to prevent qualifying is unlawful.'},
  {q:/ir35|off.?payroll|sds|status|inside|outside/i,a:'Off-payroll working (IR35): since April 2021 (private sector) and April 2017 (public), medium/large end-clients determine employment status for tax (Status Determination Statement). Agency must: pass SDS to worker, deduct tax/NI if inside IR35, allow worker to appeal. HMRC CEST tool recommended (not conclusive). Small company exemption: PSC self-assesses. Factors: control, substitution, mutuality of obligation.'},
  {q:/rtw|right.?to.?work|immigration|visa/i,a:'Immigration, Asylum and Nationality Act 2006: agencies must verify Right to Work before engagement. Acceptable documents: UK/Irish passport, share code from gov.uk, BRP (biometric residence permit), valid visa. Keep copies for duration of employment + 2 years after termination. Online RTW checks via gov.uk share code for non-UK nationals. Civil penalty up to £45,000 per illegal worker (2024 rates). Repeat offence: criminal prosecution.'},
  {q:/fee|charge|transfer|temp.?to.?perm/i,a:'Conduct Regulations 2003: employment businesses cannot charge work-seekers for finding work. Hirer fees: temp-to-perm fees capped at reasonable amount. Extended hire period (transfer fee alternative): max '+RULES.transferFeeCapMonths+' months. After that, no transfer fee. Perm agency fees: typically 15-25% of annual salary, agreed in terms of business. Fee rebate schedules common (pro-rata refund if candidate leaves within guarantee period).'},
  {q:/gdpr|data|privacy|retention/i,a:'UK GDPR / Data Protection Act 2018: lawful basis required for processing candidate data — typically consent (job applications) or legitimate interest (proactive sourcing). Privacy notice required before processing. Data retention: active candidates — duration of relationship + reasonable period; unsuccessful applicants — typically 6-12 months. Rights: access, rectification, erasure, portability. Special category data (disability, health) — explicit consent required. ICO registration mandatory.'},
  {q:/holiday|wtr|working.?time|pay/i,a:'Working Time Regulations 1998: agency workers entitled to 5.6 weeks paid annual leave (28 days for full-time). Holiday pay: calculated on average earnings over 52-week reference period. Rolled-up holiday pay: permitted since January 2024 (Employment Rights (Amendment, Revocation and Transitional Provision) Regulations 2023). Agency must clearly show holiday pay element on payslip if using rolled-up method.'},
  {q:/hmrc|paye|rti|tax|ni/i,a:'HMRC: agency operates PAYE for agency workers on payroll. RTI (Real Time Information): Full Payment Submission by or before each payday. Employer Payment Summary by 19th of following month. Starter/leaver declarations. NI: employer NI on earnings above secondary threshold. Student loan deductions where applicable. HMRC penalties for late filing.'},
  {q:/insurance|indemnity|liability/i,a:'Recruitment insurance: Professional Indemnity (PI) — covers advice and service failures. Public Liability (PL) — injury/damage on client premises. Employers\' Liability (EL) — mandatory for temp workers on agency payroll (min £5M, Employers\' Liability (Compulsory Insurance) Act 1969). Consider also: cyber liability, D&O. REC members may get preferential rates.'},
  {q:/eas|inspectorate|enforcement|penalty/i,a:'Employment Agency Standards Inspectorate (EAS): enforcement body under Employment Agencies Act 1973 and Conduct Regulations 2003. Powers: inspect records, interview staff, issue prohibition orders (banning individuals from running agencies), prosecute. Offences: charging work-seekers, withholding pay, failing to keep records, operating without agreed terms. Maximum fine: unlimited (post-Legal Aid, Sentencing and Punishment of Offenders Act 2012).'},
];
function askT0(q){for(const r of T0_QA){if(r.q.test(q))return {answer:r.a,source:'T0 · UK recruitment rules'}}return null}
async function askT3(q){if(!state.settings.anthropicKey)return null;try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':state.settings.anthropicKey,'anthropic-version':'2023-06-01','content-type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:'You are a UK recruitment agency compliance expert. Conduct Regulations 2003, AWR 2010, IR35 off-payroll, HMRC PAYE, EAS. Concise.\n\n'+q}]})});if(!res.ok)return null;const j=await res.json();return {answer:j.content?.[0]?.text,source:'T3 · Anthropic'}}catch(e){return null}}
function renderQA(v){v.innerHTML=`<div class="section-h"><h2>Q & A</h2><div class="sub">T0 + T3 BYOK</div></div><div class="card" style="max-width:780px"><div class="chat" id="chatBox">${(state.ui.chat||[]).map(m=>`<div class="msg ${m.role}">${esc(m.text)}${m.source?`<div class="src">${esc(m.source)}</div>`:''}</div>`).join('')}</div><div class="chat-input"><input id="chatIn" placeholder="Ask… 'AWR 12-week rule?' · 'IR35 determination?' · 'transfer fees?'" onkeydown="if(event.key==='Enter')askQ()"><button class="btn brass" onclick="askQ()">Ask</button></div></div>`;const box=$('#chatBox');if(box)box.scrollTop=box.scrollHeight}
async function askQ(){const inp=$('#chatIn');if(!inp)return;const q=inp.value.trim();if(!q)return;inp.value='';if(!state.ui.chat)state.ui.chat=[];state.ui.chat.push({role:'user',text:q});render();let r=askT0(q);if(!r)r=await askT3(q);state.ui.chat.push(r?{role:'bot',text:r.answer,source:r.source}:{role:'bot',text:'No T0 match. Add BYOK key for T3.',source:'system'});persistUI();render()}

function openModal(type){const modal=$('#modal');modal.classList.add('open');
  if(type==='settings'){$('#modalTitle').textContent='Settings';$('#modalBody').innerHTML=`<div class="card"><h3>Agency</h3><div class="row"><div class="field"><label>Agency name</label><input id="fName" value="${esc(state.firm?.name||'')}"></div><div class="field"><label>Company no</label><input id="fCoNo" value="${esc(state.firm?.companyNo||'')}"></div></div><div class="field"><label>Address</label><input id="fAddr" value="${esc(state.firm?.address||'')}"></div><div class="row"><div class="field"><label>Phone</label><input id="fPhone" value="${esc(state.firm?.phone||'')}"></div><div class="field"><label>Email</label><input id="fEmail" value="${esc(state.firm?.email||'')}"></div></div><div class="field"><label>ICO registration no</label><input id="fIco" value="${esc(state.firm?.icoNumber||'')}"></div></div><div class="card"><h3>API</h3><div class="field"><label>Anthropic key (T3)</label><input type="password" id="sKey" value="${esc(state.settings.anthropicKey||'')}"></div><div style="margin:10px 0"><label style="font-size:12px"><input type="checkbox" id="sAudit" ${state.settings.auditChain?'checked':''}> Audit chain</label></div></div><div class="actions"><button class="btn ghost sm" onclick="exportAll()">Export</button><button class="btn ghost sm" onclick="importAll()">Import</button><button class="btn danger sm" onclick="wipeAll()">Wipe</button><button class="btn brass" onclick="saveSettings()">Save</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}
  else if(type==='addCandidate'){$('#modalTitle').textContent='Add Candidate';$('#modalBody').innerHTML=`<div class="row"><div class="field"><label>Name</label><input id="cName"></div><div class="field"><label>Email</label><input id="cEmail"></div></div><div class="row"><div class="field"><label>Phone</label><input id="cPhone"></div><div class="field"><label>Sector</label><select id="cSector"><option>IT</option><option>Finance</option><option>Engineering</option><option>Healthcare</option><option>Legal</option><option>Construction</option><option>Education</option><option>Admin</option><option>Other</option></select></div></div><div class="row"><div class="field"><label>Status</label><select id="cStatus"><option>available</option><option>placed</option><option>unavailable</option></select></div><div class="field"><label>Right to work verified</label><select id="cRtw"><option value="1">Yes</option><option value="0">No</option></select></div></div><div class="field"><label>DBS date (if applicable)</label><input type="date" id="cDbs"></div><div class="actions"><button class="btn brass" onclick="addCandidate()">Add</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}
  else if(type==='addClient'){$('#modalTitle').textContent='Add Client';$('#modalBody').innerHTML=`<div class="row"><div class="field"><label>Company</label><input id="clComp"></div><div class="field"><label>Contact name</label><input id="clContact"></div></div><div class="row"><div class="field"><label>Email</label><input id="clEmail"></div><div class="field"><label>Sector</label><select id="clSector"><option>IT</option><option>Finance</option><option>Engineering</option><option>Healthcare</option><option>Legal</option><option>Construction</option><option>Education</option><option>Other</option></select></div></div><div class="row"><div class="field"><label>Terms type</label><select id="clTerms"><option>standard</option><option>PSL</option><option>exclusive</option><option>RPO</option></select></div><div class="field"><label>IR35 size</label><select id="clIr35"><option>large</option><option>medium</option><option>small</option></select></div></div><div class="actions"><button class="btn brass" onclick="addClient()">Add</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}
  else if(type==='addVacancy'){$('#modalTitle').textContent='Add Vacancy';$('#modalBody').innerHTML=`<div class="row"><div class="field"><label>Title</label><input id="vTitle"></div><div class="field"><label>Client</label><select id="vClient">${state.clients.map(c=>`<option value="${c.id}">${esc(c.company)}</option>`).join('')}</select></div></div><div class="row"><div class="field"><label>Type</label><select id="vType" onchange="document.getElementById('vSalary').parentElement.style.display=this.value==='permanent'?'':'none';document.getElementById('vRate').parentElement.style.display=this.value!=='permanent'?'':'none'"><option>permanent</option><option>temporary</option><option>contract</option><option>fixed-term</option></select></div><div class="field"><label>Status</label><select id="vStatus"><option>open</option><option>filled</option><option>closed</option></select></div></div><div class="row"><div class="field"><label>Salary £</label><input type="number" id="vSalary"></div><div class="field" style="display:none"><label>Day rate £</label><input type="number" id="vRate"></div></div><div class="row"><div class="field"><label>IR35 status</label><select id="vIr35"><option>TBD</option><option>inside</option><option>outside</option><option>n/a</option></select></div><div class="field"><label>Candidates submitted</label><input type="number" id="vCands" value="0"></div></div><div class="actions"><button class="btn brass" onclick="addVacancy()">Add</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}
  else if(type==='addPlacement'){$('#modalTitle').textContent='Add Placement';$('#modalBody').innerHTML=`<div class="row"><div class="field"><label>Candidate name</label><input id="pCand"></div><div class="field"><label>Client name</label><input id="pClient"></div></div><div class="row"><div class="field"><label>Role</label><input id="pRole"></div><div class="field"><label>Type</label><select id="pType"><option>permanent</option><option>temporary</option><option>contract</option><option>fixed-term</option></select></div></div><div class="row"><div class="field"><label>Start date</label><input type="date" id="pStart"></div><div class="field"><label>Status</label><select id="pStatus"><option>active</option><option>completed</option><option>cancelled</option></select></div></div><div class="row"><div class="field"><label>Fee £</label><input type="number" id="pFee"></div><div class="field"><label>Invoiced</label><select id="pInv"><option value="0">No</option><option value="1">Yes</option></select></div></div><div class="actions"><button class="btn brass" onclick="addPlacement()">Add</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}
}
function closeModal(){$('#modal').classList.remove('open')}

async function addCandidate(){const c={id:uid('cn'),name:$('#cName').value.trim(),email:$('#cEmail').value.trim(),phone:$('#cPhone').value.trim(),sector:$('#cSector').value,status:$('#cStatus').value,rtw:$('#cRtw').value==='1',dbsDate:$('#cDbs').value,ts:now()};state.candidates.push(c);await idbPut('candidates',c);await auditLog('candidate.added',{payload:{id:c.id}});closeModal();toast('Added');render()}
async function addClient(){const c={id:uid('cl'),company:$('#clComp').value.trim(),contact:$('#clContact').value.trim(),email:$('#clEmail').value.trim(),sector:$('#clSector').value,termsType:$('#clTerms').value,ir35Size:$('#clIr35').value,ts:now()};state.clients.push(c);await idbPut('clients',c);await auditLog('client.added',{payload:{id:c.id}});closeModal();toast('Added');render()}
async function addVacancy(){const vc={id:uid('vc'),title:$('#vTitle').value.trim(),clientId:$('#vClient').value,type:$('#vType').value,status:$('#vStatus').value,salary:Number($('#vSalary').value||0),dayRate:Number($('#vRate').value||0),ir35:$('#vIr35').value,candidateCount:Number($('#vCands').value||0),ts:now()};state.vacancies.push(vc);await idbPut('vacancies',vc);await auditLog('vacancy.added',{payload:{id:vc.id}});closeModal();toast('Added');render()}
async function addPlacement(){const p={id:uid('pl'),candidateName:$('#pCand').value.trim(),clientName:$('#pClient').value.trim(),role:$('#pRole').value.trim(),type:$('#pType').value,startDate:$('#pStart').value,status:$('#pStatus').value,fee:Number($('#pFee').value||0),invoiced:$('#pInv').value==='1',ts:now()};state.placements.push(p);await idbPut('placements',p);await auditLog('placement.added',{payload:{id:p.id}});closeModal();toast('Added');render()}
async function saveSettings(){const f=state.firm||{id:uid('fi'),ts:now()};f.name=$('#fName').value.trim();f.companyNo=$('#fCoNo').value.trim();f.address=$('#fAddr').value.trim();f.phone=$('#fPhone').value.trim();f.email=$('#fEmail').value.trim();f.icoNumber=$('#fIco').value.trim();f.updatedAt=now();state.firm=f;await idbPut('firms',f);state.settings.anthropicKey=$('#sKey').value.trim();state.settings.auditChain=$('#sAudit').checked;$('#tierBadge').textContent=state.settings.anthropicKey?'T3':'T0';await persistUI();closeModal();toast('Saved');render()}
function exportAll(){const d={tool:TOOLNAME,v:VERSION,ts:now(),firm:state.firm,candidates:state.candidates,clients:state.clients,vacancies:state.vacancies,placements:state.placements};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='fallrecruit-export.json';a.click();URL.revokeObjectURL(u);toast('Exported')}
function importAll(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.firm){state.firm=d.firm;await idbPut('firms',d.firm)}for(const k of['candidates','clients','vacancies','placements']){if(Array.isArray(d[k]))for(const r of d[k]){state[k].push(r);await idbPut(k,r)}}persistUI();toast('Imported');render()}catch(e){toast('Failed')}};inp.click()}
async function wipeAll(){if(!confirm('Wipe ALL data?'))return;for(const s of['firms','candidates','clients','vacancies','placements','audit','state']){const tx=db.transaction(s,'readwrite');tx.objectStore(s).clear();await new Promise(r=>{tx.oncomplete=r})}location.reload()}

(async function boot(){try{await openDB();await loadAll();await seedDemo();initMesh();$('#tierBadge').textContent=state.settings.anthropicKey?'T3':'T0';render()}catch(e){console.error('[fallrecruit] boot error:',e);document.getElementById('view').innerHTML='<div class="empty">Boot error: '+esc(e.message)+'</div>'}})();
</script>
