<style>

*{margin:0;padding:0;box-sizing:border-box}html,body{background:var(--void);color:var(--cream);font:14px/1.55 var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;padding:18px;z-index:900;backdrop-filter:blur(4px)}.modal-bg.open{display:flex}.modal{background:var(--void-2);border:1px solid var(--brass);border-radius:4px;padding:22px;max-width:700px;width:100%;max-height:90vh;overflow:auto}.modal h2{font-family:var(--serif);font-size:17px;margin-bottom:14px}.modal .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brass);color:var(--void);padding:9px 18px;border-radius:3px;font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;opacity:0;transition:all 0.22s;z-index:1100;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){nav.tabs button{padding:0 10px;font-size:11px}main{padding:14px 14px 50px}.row{grid-template-columns:1fr}.kpi-grid{grid-template-columns:1fr 1fr}}

<script>
/*!
 * Fall Kit · v1.0.0 · the shared cascade for every estate seed
 * MIT · Simon Gant · ai-nativesolutions.com · ◊·κ=1
 *
 * Inlineable JS module. Drop into any seed via <script> or copy-paste inline.
 * Preserves single-HTML sovereignty (no external deps until user opts in to T2 WebLLM).
 *
 * What it gives every seed:
 *  - AI tier picker: T0 (off · default) · T2 (WebLLM in-browser, 5 models 1B-70B) · T3 (BYOK Anthropic/OpenAI/Google)
 *  - Universal entry: FallKit.aiComplete(systemPrompt, userMsg, maxTokens) → string|null
 *  - AI chip UI in header
 *  - WebRTC P2P mesh (ported from canonical fallnet · fall-signal channel · Google STUN)
 *  - Help section partial: FallKit.helpSection()
 *  - Settings panel: FallKit.openSettings()
 *
 * Doctrine (per botler CLAUDE.md):
 *  - T0 fallback ALWAYS works · aiComplete returns null · caller MUST degrade gracefully
 *  - NEVER hide a feature behind AI · NEVER proxy API keys · NEVER log keys
 *  - WebLLM is lazy-loaded · model weights download ONLY on user opt-in
 *
 * Estate-first canonical references:
 *  - WebLLM pattern: Downloads/botler/index.html (T0/T2/T3 cascade)
 *  - WebRTC pattern: Downloads/fallnet/fallnet-shim.js (raw RTCPeerConnection)
 *  - Konomi seal:    ◊·κ=1  (consistent across all estate seeds)
 *  - Mesh channel:   'fall-signal'
 */
(function (root) {
  'use strict';

  const FALL_KIT_VERSION = '1.2.0';
  const KCC_MINT_URL = 'https://sjgant80-hub.github.io/kcc-mint/';

  // ─── Model registry ──────────────────────────────────────────────
  const WEBLLM_MODELS = {
    'llama-1b':  { id: 'Llama-3.2-1B-Instruct-q4f16_1-MLC',   size: '~700MB', label: '1B · fast · any laptop / phone' },
    'llama-3b':  { id: 'Llama-3.2-3B-Instruct-q4f16_1-MLC',   size: '~2GB',   label: '3B · balanced · default · most laptops' },
    'qwen-7b':   { id: 'Qwen2.5-7B-Instruct-q4f16_1-MLC',     size: '~5GB',   label: '7B · capable · needs decent GPU (M-series Mac / 8GB+ VRAM)' },
    'llama-8b':  { id: 'Llama-3.1-8B-Instruct-q4f16_1-MLC',   size: '~5GB',   label: '8B · common · needs decent GPU' },
    'llama-70b': { id: 'Llama-3.1-70B-Instruct-q4f16_1-MLC',  size: '~40GB',  label: '70B · frontier · needs serious GPU + 64GB+ RAM' },
  };
  const DEFAULT_MODEL = 'llama-3b';

  const T3_PROVIDERS = {
    anthropic: { label: 'Anthropic Claude', models: ['claude-sonnet-4-5','claude-opus-4-7','claude-haiku-4-5'], default: 'claude-sonnet-4-5', url: 'https://api.anthropic.com/v1/messages' },
    openai:    { label: 'OpenAI',           models: ['gpt-4o','gpt-4o-mini','o1-mini'],                          default: 'gpt-4o-mini',      url: 'https://api.openai.com/v1/chat/completions' },
    google:    { label: 'Google Gemini',    models: ['gemini-1.5-pro','gemini-1.5-flash','gemini-2.0-flash-exp'], default: 'gemini-1.5-flash', url: 'https://generativelanguage.googleapis.com/v1beta/models/' },
  };

  // ─── State ───────────────────────────────────────────────────────
  const STATE = {
    config: loadConfig(),
    ai: { ready: false, loading: false, progress: 0, engine: null, model: null },
    mesh: { active: false, peers: new Map(), bc: null, signal: null },
  };

  function loadConfig() {
    try { return JSON.parse(localStorage.getItem('fall-kit.config') || '{}'); }
    catch (e) { return {}; }
  }
  function saveConfig() {
    try { localStorage.setItem('fall-kit.config', JSON.stringify(STATE.config)); } catch (e) {}
  }

  // ─── DOM helpers ─────────────────────────────────────────────────
  function $(s, root) { return (root || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  // ─── AI tier ─────────────────────────────────────────────────────
  function aiTier() { return STATE.config.ai_tier || 'T0'; }

  function renderAiChip() {
    const chip = $('#fk-ai-chip');
    if (!chip) return;
    const txt = $('#fk-ai-chip-text');
    chip.classList.remove('fk-chip-live', 'fk-chip-loading', 'fk-chip-warn');
    const tier = aiTier();
    if (tier === 'T0') { txt.textContent = 'T0 · off'; }
    else if (tier === 'T2') {
      if (STATE.ai.ready) { txt.textContent = 'T2 ' + (WEBLLM_MODELS[STATE.config.webllm_model || DEFAULT_MODEL]?.label.split(' · ')[0] || '') + ' · ready'; chip.classList.add('fk-chip-live'); }
      else if (STATE.ai.loading) { txt.textContent = 'T2 loading ' + Math.round(STATE.ai.progress) + '%'; chip.classList.add('fk-chip-loading'); }
      else { txt.textContent = 'T2 · click to load'; chip.classList.add('fk-chip-warn'); }
    } else if (tier === 'T3') {
      if (STATE.config.api_key) { txt.textContent = 'T3 ' + (T3_PROVIDERS[STATE.config.api_provider]?.label || 'BYOK') + ' · active'; chip.classList.add('fk-chip-live'); }
      else { txt.textContent = 'T3 · no key set'; chip.classList.add('fk-chip-warn'); }
    }
  }

  async function loadWebLLM(modelKey) {
    if (STATE.ai.loading) return;
    const key = modelKey || STATE.config.webllm_model || DEFAULT_MODEL;
    const model = WEBLLM_MODELS[key];
    if (!model) { console.error('fall-kit: unknown model', key); return; }
    if (STATE.ai.ready && STATE.ai.model === model.id) return;
    STATE.ai.loading = true; STATE.ai.progress = 0; renderAiChip();
    notify('Loading WebLLM · ' + model.label + ' · ' + model.size + ' first time', 'info');
    try {
      const { CreateMLCEngine } = await import('https://esm.run/@mlc-ai/web-llm@0.2.79');
      const engine = await CreateMLCEngine(model.id, {
        initProgressCallback: p => { STATE.ai.progress = (p.progress || 0) * 100; renderAiChip(); }
      });
      STATE.ai.engine = engine;
      STATE.ai.model = model.id;
      STATE.ai.ready = true;
      STATE.ai.loading = false;
      STATE.config.webllm_model = key; saveConfig();
      renderAiChip();
      notify('WebLLM ready · sovereign mode · ' + model.label.split(' · ')[0], 'ok');
    } catch (e) {
      console.error('fall-kit: WebLLM load failed', e);
      STATE.ai.loading = false; renderAiChip();
      notify('WebLLM load failed · ' + e.message, 'err');
    }
  }

  async function aiComplete(systemPrompt, userMsg, maxTokens) {
    maxTokens = maxTokens || 600;
    const tier = aiTier();
    if (tier === 'T2' && STATE.ai.ready && STATE.ai.engine) {
      const r = await STATE.ai.engine.chat.completions.create({
        messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userMsg }],
        max_tokens: maxTokens,
      });
      return r.choices[0].message.content;
    }
    if (tier === 'T3' && STATE.config.api_key && STATE.config.api_provider) {
      return await aiCloudCall(systemPrompt, userMsg, maxTokens);
    }
    return null;
  }

  async function aiCloudCall(sys, msg, maxTokens) {
    const provider = STATE.config.api_provider;
    const key = STATE.config.api_key;
    const model = STATE.config.api_model || T3_PROVIDERS[provider]?.default;
    if (provider === 'anthropic') {
      const r = await fetch(T3_PROVIDERS.anthropic.url, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01' },
        body: JSON.stringify({ model, max_tokens: maxTokens, system: sys, messages: [{ role: 'user', content: msg }] }),
      });
      if (!r.ok) throw new Error('Anthropic ' + r.status + ': ' + (await r.text()).slice(0, 200));
      const j = await r.json();
      return j.content[0].text;
    }
    if (provider === 'openai') {
      const r = await fetch(T3_PROVIDERS.openai.url, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, max_tokens: maxTokens, messages: [{ role: 'system', content: sys }, { role: 'user', content: msg }] }),
      });
      if (!r.ok) throw new Error('OpenAI ' + r.status);
      const j = await r.json();
      return j.choices[0].message.content;
    }
    if (provider === 'google') {
      const r = await fetch(T3_PROVIDERS.google.url + model + ':generateContent?key=' + encodeURIComponent(key), {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: sys + '\n\n---\n\n' + msg }] }], generationConfig: { maxOutputTokens: maxTokens } }),
      });
      if (!r.ok) throw new Error('Google ' + r.status);
      const j = await r.json();
      return j.candidates[0].content.parts[0].text;
    }
    throw new Error('unknown provider: ' + provider);
  }

  // ─── WebRTC P2P mesh (ported from canonical fallnet · fall-signal channel · Google STUN) ───
  const MESH_CHANNEL = 'fall-signal';
  const STUN_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];
  function meshStart(opts) {
    if (STATE.mesh.active) return;
    opts = opts || {};
    const seedId = opts.seedId || (location.pathname + '#' + Math.random().toString(36).slice(2, 8));
    STATE.mesh.seedId = seedId;
    try { STATE.mesh.bc = new BroadcastChannel(MESH_CHANNEL); }
    catch (e) { console.warn('fall-kit: BroadcastChannel unavailable'); return; }
    STATE.mesh.bc.onmessage = e => {
      const m = e.data;
      if (!m || !m.kind || m.peerId === seedId) return;
      if (opts.onMessage) opts.onMessage(m);
    };
    STATE.mesh.bc.postMessage({ kind: 'fall-kit:hello', peerId: seedId, ts: Date.now(), seedName: opts.seedName || 'unknown' });
    STATE.mesh.active = true;
    notify('Mesh active · channel ' + MESH_CHANNEL, 'ok');
  }
  function meshPost(kind, payload) {
    if (!STATE.mesh.active || !STATE.mesh.bc) return false;
    STATE.mesh.bc.postMessage({ kind: kind, peerId: STATE.mesh.seedId, ts: Date.now(), payload: payload });
    return true;
  }

  // ─── Toast ───────────────────────────────────────────────────────
  function notify(msg, kind) {
    let t = $('#fk-toast');
    if (!t) {
      t = document.createElement('div'); t.id = 'fk-toast';
      t.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:#c08a3a;color:#0a0a0a;padding:9px 18px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:0;transition:all .22s;z-index:10000;pointer-events:none';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.background = kind === 'err' ? '#a14a2a' : kind === 'ok' ? '#6b8d4a' : '#c08a3a';
    t.style.color = kind === 'err' ? '#fff' : '#0a0a0a';
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._to);
    t._to = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2400);
  }

  // ─── Settings modal ──────────────────────────────────────────────
  function openSettings() {
    let bg = $('#fk-modal-bg');
    if (!bg) {
      bg = document.createElement('div'); bg.id = 'fk-modal-bg';
      bg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;overflow-y:auto;z-index:9999';
      bg.onclick = e => { if (e.target.id === 'fk-modal-bg') closeSettings(); };
      document.body.appendChild(bg);
    }
    const tier = aiTier();
    const provider = STATE.config.api_provider || 'anthropic';
    const providerCfg = T3_PROVIDERS[provider];
    bg.innerHTML = `
      <div style="background:#13121a;border:1px solid #c08a3a;border-radius:5px;max-width:600px;width:100%;padding:22px 24px;color:#ebe3d2;font-family:system-ui,-apple-system,sans-serif;font-size:13.5px;line-height:1.55">
        <h3 style="font-family:Georgia,serif;font-size:18px;color:#c08a3a;margin-bottom:14px">◊ Fall Kit · AI cascade settings</h3>
        <div style="margin-bottom:14px"><label style="display:block;font-size:11px;color:#a89e88;letter-spacing:.04em;margin-bottom:6px;text-transform:uppercase">Tier</label>
          <select id="fk-tier" style="width:100%;padding:8px 11px;background:#1a1922;border:1px solid #3a342c;color:#ebe3d2;border-radius:3px;font-size:13.5px;font-family:inherit">
            <option value="T0"${tier==='T0'?' selected':''}>T0 · off (default · the seed works fully without AI)</option>
            <option value="T2"${tier==='T2'?' selected':''}>T2 · WebLLM in-browser · sovereign · pick a model below</option>
            <option value="T3"${tier==='T3'?' selected':''}>T3 · BYOK · Anthropic / OpenAI / Google · stored in your browser only</option>
          </select>
        </div>
        <div id="fk-t2-block" style="display:${tier==='T2'?'block':'none'};margin-bottom:14px;padding:12px 14px;background:#1a1922;border:1px solid #2a2934;border-radius:4px">
          <label style="display:block;font-size:11px;color:#a89e88;letter-spacing:.04em;margin-bottom:6px;text-transform:uppercase">WebLLM model · 1B → 70B cascade</label>
          <select id="fk-model" style="width:100%;padding:8px 11px;background:#22212c;border:1px solid #3a342c;color:#ebe3d2;border-radius:3px;font-size:13px;font-family:inherit">
            ${Object.entries(WEBLLM_MODELS).map(([k,m]) => `<option value="${k}"${(STATE.config.webllm_model||DEFAULT_MODEL)===k?' selected':''}>${esc(m.label)} · ${esc(m.size)}</option>`).join('')}
          </select>
          <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <button id="fk-load-llm" style="padding:7px 14px;background:#c08a3a;color:#0a0a0a;border:none;border-radius:3px;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit">${STATE.ai.ready?'✓ Loaded · switch':'Load model (one-time download)'}</button>
            <span id="fk-llm-status" style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#a89e88;letter-spacing:.04em">${STATE.ai.ready?'ready':STATE.ai.loading?Math.round(STATE.ai.progress)+'%':'not loaded'}</span>
          </div>
          <div style="margin-top:8px;font-size:11px;color:#6e6a5e;line-height:1.55">First load downloads the model from @mlc-ai/web-llm CDN. Cached forever after. Inference is 100% local — open DevTools → Network during use, nothing leaves.</div>
        </div>
        <div id="fk-t3-block" style="display:${tier==='T3'?'block':'none'};margin-bottom:14px;padding:12px 14px;background:#1a1922;border:1px solid #2a2934;border-radius:4px">
          <label style="display:block;font-size:11px;color:#a89e88;letter-spacing:.04em;margin-bottom:6px;text-transform:uppercase">BYOK provider</label>
          <select id="fk-provider" style="width:100%;padding:8px 11px;background:#22212c;border:1px solid #3a342c;color:#ebe3d2;border-radius:3px;font-size:13px;font-family:inherit;margin-bottom:10px">
            ${Object.entries(T3_PROVIDERS).map(([k,p]) => `<option value="${k}"${provider===k?' selected':''}>${esc(p.label)}</option>`).join('')}
          </select>
          <label style="display:block;font-size:11px;color:#a89e88;letter-spacing:.04em;margin-bottom:6px;text-transform:uppercase">Model</label>
          <select id="fk-api-model" style="width:100%;padding:8px 11px;background:#22212c;border:1px solid #3a342c;color:#ebe3d2;border-radius:3px;font-size:13px;font-family:inherit;margin-bottom:10px">
            ${providerCfg.models.map(m => `<option value="${m}"${(STATE.config.api_model||providerCfg.default)===m?' selected':''}>${esc(m)}</option>`).join('')}
          </select>
          <label style="display:block;font-size:11px;color:#a89e88;letter-spacing:.04em;margin-bottom:6px;text-transform:uppercase">API key</label>
          <input type="password" id="fk-key" value="${esc(STATE.config.api_key || '')}" placeholder="${STATE.config.api_key ? '(set · leave empty to keep)' : 'sk-ant-... or sk-... or AIza...'}" autocomplete="off" style="width:100%;padding:8px 11px;background:#22212c;border:1px solid #3a342c;color:#ebe3d2;border-radius:3px;font-size:13px;font-family:ui-monospace,Menlo,monospace">
          <div style="margin-top:8px;font-size:11px;color:#6e6a5e;line-height:1.55">Key lives in this browser only (localStorage). Sent direct to the provider — never to us. Wipe with Reset.</div>
        </div>
        <div style="margin-bottom:14px;padding:12px 14px;background:#1a1922;border:1px solid #2a2934;border-radius:4px">
          <label style="display:block;font-size:11px;color:#a89e88;letter-spacing:.04em;margin-bottom:6px;text-transform:uppercase">Cross-seed mesh</label>
          <div style="display:flex;gap:8px;align-items:center">
            <button id="fk-mesh-toggle" style="padding:6px 12px;background:${STATE.mesh.active?'#6b8d4a':'#1a1922'};color:${STATE.mesh.active?'#fff':'#a89e88'};border:1px solid ${STATE.mesh.active?'#6b8d4a':'#3a342c'};border-radius:3px;font-size:11px;cursor:pointer;font-family:inherit">${STATE.mesh.active?'✓ Active · disconnect':'Activate mesh'}</button>
            <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#6e6a5e;letter-spacing:.04em">channel · <code style="background:#22212c;padding:1px 5px;border-radius:2px">${MESH_CHANNEL}</code></span>
          </div>
          <div style="margin-top:8px;font-size:11px;color:#6e6a5e;line-height:1.55">BroadcastChannel for same-device · WebRTC for cross-device (planned). Other estate seeds on the same channel discover each other automatically.</div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
          <button onclick="FallKit.closeSettings()" style="padding:7px 14px;background:transparent;color:#a89e88;border:1px solid #3a342c;border-radius:3px;font-size:12px;cursor:pointer;font-family:inherit">Close</button>
          <button id="fk-save" style="padding:7px 14px;background:#c08a3a;color:#0a0a0a;border:none;border-radius:3px;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit">Save</button>
        </div>
        <div style="margin-top:14px;font-family:ui-monospace,Menlo,monospace;font-size:9px;color:#6e6a5e;letter-spacing:.08em;text-align:center">◊ Fall Kit v${FALL_KIT_VERSION} · MIT · ai-nativesolutions.com · ◊·κ=1</div>
      </div>`;
    // Wire interactions
    $('#fk-tier').onchange = () => {
      const t = $('#fk-tier').value;
      $('#fk-t2-block').style.display = t === 'T2' ? 'block' : 'none';
      $('#fk-t3-block').style.display = t === 'T3' ? 'block' : 'none';
    };
    $('#fk-provider') && ($('#fk-provider').onchange = () => {
      const p = $('#fk-provider').value;
      const sel = $('#fk-api-model');
      sel.innerHTML = T3_PROVIDERS[p].models.map(m => `<option value="${m}">${esc(m)}</option>`).join('');
    });
    $('#fk-load-llm') && ($('#fk-load-llm').onclick = () => {
      const m = $('#fk-model').value;
      loadWebLLM(m);
    });
    $('#fk-mesh-toggle').onclick = () => {
      if (STATE.mesh.active) { STATE.mesh.bc?.close(); STATE.mesh.active = false; STATE.mesh.bc = null; notify('Mesh disconnected'); }
      else meshStart({ seedName: STATE.config.seedName || 'seed' });
      openSettings();  // refresh modal
    };
    $('#fk-save').onclick = () => {
      STATE.config.ai_tier = $('#fk-tier').value;
      if ($('#fk-model')) STATE.config.webllm_model = $('#fk-model').value;
      if ($('#fk-provider')) STATE.config.api_provider = $('#fk-provider').value;
      if ($('#fk-api-model')) STATE.config.api_model = $('#fk-api-model').value;
      const newKey = $('#fk-key')?.value;
      if (newKey) STATE.config.api_key = newKey;
      saveConfig(); renderAiChip(); notify('Saved', 'ok'); closeSettings();
    };
  }
  function closeSettings() { const bg = $('#fk-modal-bg'); if (bg) bg.remove(); }

  // ─── Help section (returns HTML string for inclusion in seed Help tabs) ───
  function helpSection() {
    return `<div style="background:rgba(192,138,58,.05);border:1px solid #3a342c;border-radius:4px;padding:18px 22px;margin:14px 0">
      <h4 style="font-family:Georgia,serif;font-size:15px;color:#c08a3a;margin-bottom:12px">◊ AI cascade · the 3 tiers</h4>
      <p style="font-size:13px;color:#a89e88;line-height:1.7;margin-bottom:10px">This seed runs fully without AI (<strong style="color:#c08a3a">T0</strong>, default). Enable a tier in settings if you want AI-assist features:</p>
      <table style="width:100%;border-collapse:collapse;font-size:12.5px">
        <thead><tr><th style="padding:6px 10px;text-align:left;background:rgba(0,0,0,.2);font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#a89e88;letter-spacing:.08em;text-transform:uppercase">Tier</th><th style="padding:6px 10px;text-align:left;background:rgba(0,0,0,.2);font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#a89e88;letter-spacing:.08em;text-transform:uppercase">What it is</th></tr></thead>
        <tbody>
          <tr><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#c08a3a;font-weight:600">T0</td><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#a89e88">Off. The seed works fully. No AI · no downloads · no API calls.</td></tr>
          <tr><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#c08a3a;font-weight:600">T2</td><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#a89e88">WebLLM in-browser. Pick a model: 1B (700MB, fast) → 3B (2GB, balanced) → 7B (5GB, capable) → 70B (40GB, frontier). One-time download, runs offline forever after. Zero data leaves your device.</td></tr>
          <tr><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#c08a3a;font-weight:600">T3</td><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#a89e88">BYOK · Anthropic Claude · OpenAI GPT · Google Gemini. You bring the API key, you pay the provider direct. Key stays in your browser, sent direct to the provider, never proxied.</td></tr>
        </tbody>
      </table>
      <p style="font-size:12px;color:#6e6a5e;line-height:1.6;margin-top:10px">Open the AI chip in the header to switch tier or check status. Cross-seed mesh activates a BroadcastChannel on <code style="background:#1a1922;padding:1px 5px;border-radius:2px">${MESH_CHANNEL}</code> so other estate seeds on the same device discover this one.</p>
    </div>`;
  }

  // ─── CSS for AI chip ─────────────────────────────────────────────
  function injectCss() {
    if (document.getElementById('fk-css')) return;
    const s = document.createElement('style');
    s.id = 'fk-css';
    s.textContent = `
      #fk-ai-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:3px; font-family:ui-monospace,Menlo,monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; cursor:pointer; border:1px solid #3a342c; background:#1a1922; color:#a89e88; user-select:none; vertical-align:middle }
      #fk-ai-chip:hover { border-color:#c08a3a; color:#ebe3d2 }
      #fk-ai-chip.fk-chip-live { border-color:#6b8d4a; color:#6b8d4a; background:rgba(107,141,74,.10) }
      #fk-ai-chip.fk-chip-loading { border-color:#e8a83a; color:#e8a83a; background:rgba(232,168,58,.10) }
      #fk-ai-chip.fk-chip-warn { border-color:#a14a2a; color:#a14a2a; background:rgba(161,74,42,.08) }
      #fk-ai-chip .fk-dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0 }
      #fk-ai-chip.fk-chip-loading .fk-dot { animation:fk-pulse 1s infinite }
      @keyframes fk-pulse { 0%,100%{opacity:1}50%{opacity:.3} }
      .fk-ai-assist { display:inline-flex; align-items:center; gap:5px; padding:4px 9px; font-size:11px; border:1px solid #c08a3a; color:#c08a3a; background:transparent; border-radius:3px; cursor:pointer; font-family:inherit }
      .fk-ai-assist:hover { background:#c08a3a; color:#0a0a0a }
      .fk-ai-assist::before { content:'✦'; font-size:12px }
    `;
    document.head.appendChild(s);
  }

  // ─── KCC Mint launcher (v1.2 · fork-this-seed shortcut) ──────────
  function openMint() {
    const slug = (STATE.config.seedName || location.hostname.split('.')[0] || 'seed').replace(/[^a-z0-9-]/gi, '-').toLowerCase();
    const name = document.title.replace(/^[◊·\s]+/, '').split('·')[0].trim() || slug;
    const url = location.href.split('?')[0].split('#')[0];
    const desc = document.querySelector('meta[name="description"]')?.content?.slice(0, 200) || '';
    const params = new URLSearchParams({ fork: '1', parent_slug: slug, parent_name: name, parent_url: url, parent_desc: desc });
    window.open(KCC_MINT_URL + '?' + params.toString(), '_blank', 'noopener');
  }

  // ─── Init ────────────────────────────────────────────────────────
  function init(opts) {
    opts = opts || {};
    injectCss();
    if (opts.seedName) STATE.config.seedName = opts.seedName;
    if ($('#fk-ai-chip')) { renderAiChip(); return { version: FALL_KIT_VERSION, mounted: false }; }
    const chip = document.createElement('button');
    chip.id = 'fk-ai-chip';
    chip.title = 'AI cascade · click to configure tier and model';
    chip.innerHTML = '<span class="fk-dot"></span><span id="fk-ai-chip-text">T0 · off</span>';
    chip.onclick = openSettings;
    // Try anchor first, fall back to floating bottom-right
    const anchor = opts.chipAnchor ? $(opts.chipAnchor) : null;
    if (anchor) { anchor.appendChild(chip); }
    else {
      chip.style.cssText += ';position:fixed;bottom:14px;left:14px;z-index:9998;box-shadow:0 4px 14px rgba(0,0,0,.4)';
      document.body.appendChild(chip);
    }
    // v1.2 · floating mint button next to chip
    if (!$('#fk-mint-btn') && !opts.hideMint) {
      const mintBtn = document.createElement('button');
      mintBtn.id = 'fk-mint-btn';
      mintBtn.title = 'Mint a fork of this seed as a KCC bundle · provenance economy';
      mintBtn.innerHTML = '<span style="font-size:13px">✦</span> mint fork';
      mintBtn.style.cssText = 'position:fixed;bottom:14px;left:130px;z-index:9998;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;cursor:pointer;border:1px solid #c08a3a;color:#c08a3a;background:rgba(10,10,15,.7);box-shadow:0 4px 14px rgba(0,0,0,.4)';
      mintBtn.onmouseover = () => { mintBtn.style.background = '#c08a3a'; mintBtn.style.color = '#0a0a0a'; };
      mintBtn.onmouseout  = () => { mintBtn.style.background = 'rgba(10,10,15,.7)'; mintBtn.style.color = '#c08a3a'; };
      mintBtn.onclick = openMint;
      document.body.appendChild(mintBtn);
    }
    renderAiChip();
    return { version: FALL_KIT_VERSION, mounted: true };
  }

  // ─── Public API ──────────────────────────────────────────────────
  root.FallKit = {
    version: FALL_KIT_VERSION,
    init: init,
    aiTier: aiTier,
    aiComplete: aiComplete,
    loadWebLLM: loadWebLLM,
    openSettings: openSettings,
    closeSettings: closeSettings,
    renderAiChip: renderAiChip,
    helpSection: helpSection,
    meshStart: meshStart,
    meshPost: meshPost,
    notify: notify,
    openMint: openMint,  // v1.2 · launch kcc-mint with this seed prefilled as parent
    MODELS: WEBLLM_MODELS,
    PROVIDERS: T3_PROVIDERS,
    state: STATE,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  // fall-kit init · auto-mounts a floating AI chip bottom-left
  (function () {
    function go() { if (typeof FallKit !== 'undefined') FallKit.init({ seedName: "fallrecruit" }); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
    else go();
  })();
</script>
<!-- FALL_KIT_END v1 -->
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="mark">◊</div><div><div class="name">FallRecruit</div></div><div class="seal">v1 · prime 977</div></div>
  <nav class="tabs" id="tabNav"></nav>
  <div class="tools-r"><button class="tool-btn" id="tierBadge" onclick="openModal('settings')">T0</button><button class="tool-btn" onclick="openModal('settings')">⚙</button></div>
</header>
<main id="view"></main>
</div>
<div class="modal-bg" id="modal"><div class="modal"><h2 id="modalTitle">.</h2><div id="modalBody"></div></div></div>
<div class="toast" id="toast">.</div>

<script>
'use strict';
const TOOLNAME='fallrecruit',VERSION='1.0.0',PRIME=977,STORE='fallrecruit-v1';
const TABS=[{id:'dashboard',label:'dashboard'},{id:'candidates',label:'candidates'},{id:'clients',label:'clients'},{id:'vacancies',label:'vacancies'},{id:'placements',label:'placements'},{id:'compliance',label:'compliance'},{id:'qa',label:'Q&A'}];

const RULES={
  awrWeeks:12,
  conductRegsYear:2003,
  optOutCooling:7,
  wtrWeeks:0,
  minNoticeTempDays:0,
  transferFeeCapMonths:8,
  maxPermFeePercent:30,
  hmrcRTIDeadline:19,
};

let state={active:'dashboard',firm:null,candidates:[],clients:[],vacancies:[],placements:[],audit:[],
  ui:{chat:[]},settings:{anthropicKey:'',auditChain:true}};

const $=(s,p=document)=>p.querySelector(s);const uid=p=>(p||'')+'_'+Math.random().toString(36).slice(2,11);const now=()=>Date.now();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{const v=Number(n);return isNaN(v)?'—':'£'+v.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})};
const dateStr=ts=>{if(!ts)return '—';return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),1900)}
async function sha256(s){const buf=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}

let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(STORE,1);r.onupgradeneeded=e=>{const d=e.target.result;['state','audit','firms','candidates','clients','vacancies','placements'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='state'?undefined:'id'})})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=rej})}
function idbGetAll(s){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}
function idbGet(s,k){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}
function idbPut(s,v,k){return new Promise(res=>{const tx=db.transaction(s,'readwrite');const o=tx.objectStore(s);const q=k!=null?o.put(v,k):o.put(v);q.onsuccess=()=>res(true);q.onerror=()=>res(false)})}
async function loadAll(){if(!db)await openDB();const[firms,cands,cls,vacs,plcs,auditArr,uiState]=await Promise.all([idbGetAll('firms'),idbGetAll('candidates'),idbGetAll('clients'),idbGetAll('vacancies'),idbGetAll('placements'),idbGetAll('audit'),idbGet('state','ui')]);state.firm=firms[0]||null;state.candidates=cands;state.clients=cls;state.vacancies=vacs;state.placements=plcs;state.audit=auditArr.sort((a,b)=>a.i-b.i);if(uiState){state.ui=Object.assign({},state.ui,uiState.value||{});state.settings=Object.assign({},state.settings,uiState.settings||{})}}
async function persistUI(){await idbPut('state',{value:{...state.ui},settings:state.settings},'ui')}
// ⚑ The writer now shares ONE layout with verifyAudit(), so they cannot drift apart.
async function auditLog(action,opts={}){
  if(!state.settings.auditChain)return;
  const prev=state.audit.length?state.audit[state.audit.length-1]:null;
  const sealed=await AUDITCHAIN.append(state.audit,{id:uid('au'),i:(prev?prev.i:0)+1,ts:now(),tool:TOOLNAME,action,reasoning:opts.reasoning||'',configVersion:TOOLNAME+'@'+VERSION,payload:opts.payload||{}});
  state.audit.push(sealed);await idbPut('audit',sealed);
}
// The check that never existed anywhere in this tool.
async function verifyAudit(expectHead){return AUDITCHAIN.verify(state.audit,expectHead?{expectHead}:null)}

let bcRecruit,bcSignal;
function initMesh(){try{bcSignal=new BroadcastChannel('fall-signal');bcSignal.postMessage({source:TOOLNAME,type:'hello',prime:PRIME,version:VERSION,ts:now()})}catch(e){}try{bcRecruit=new BroadcastChannel('fall-recruit');bcRecruit.addEventListener('message',async e=>{const m=e.data;if(!m||m.source===TOOLNAME)return;if(m.type==='sync.snapshot'){const p=m.payload||{};if(Array.isArray(p.candidates))for(const c of p.candidates){if(!state.candidates.find(x=>x.id===c.id)){state.candidates.push(c);await idbPut('candidates',c)}}if(Array.isArray(p.clients))for(const c of p.clients){if(!state.clients.find(x=>x.id===c.id)){state.clients.push(c);await idbPut('clients',c)}}if(p.firm&&!state.firm){state.firm=p.firm;await idbPut('firms',p.firm)}render()}});bcRecruit.postMessage({v:1,type:'sync.request',ts:now(),source:TOOLNAME})}catch(e){}}

function totalPlacements(){return state.placements.length}
function activePlacements(){return state.placements.filter(p=>p.status==='active').length}
function totalFees(){return state.placements.reduce((s,p)=>s+Number(p.fee||0),0)}
function totalInvoiced(){return state.placements.filter(p=>p.invoiced).reduce((s,p)=>s+Number(p.fee||0),0)}
function totalOutstanding(){return totalFees()-totalInvoiced()}
function openVacancies(){return state.vacancies.filter(v=>v.status==='open').length}
function awrDueCount(){return state.placements.filter(p=>{if(p.type!=='temporary'||p.status!=='active')return false;if(!p.startDate)return false;const start=new Date(p.startDate);const weeks=(now()-start.getTime())/(7*24*60*60*1000);return weeks>=RULES.awrWeeks-2&&weeks<RULES.awrWeeks}).length}

function render(){$('#tabNav').innerHTML=TABS.map(t=>`<button class="${state.active===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('');const v=$('#view');switch(state.active){case 'dashboard':return renderDashboard(v);case 'candidates':return renderCandidates(v);case 'clients':return renderClients(v);case 'vacancies':return renderVacancies(v);case 'placements':return renderPlacements(v);case 'compliance':return renderCompliance(v);case 'qa':return renderQA(v)}}
function switchTab(id){state.active=id;persistUI();render()}

function renderDashboard(v){v.innerHTML=`<div class="disclaimer"><strong>◊ Regulatory notice:</strong> FallRecruit is shaped by the Employment Agencies Act 1973, Conduct of Employment Agencies and Employment Businesses Regulations 2003, Agency Workers Regulations 2010, and HMRC off-payroll (IR35) rules. All employment decisions remain the agency's responsibility. Data never leaves this device.</div><div class="section-h"><h2>Dashboard</h2><div class="sub">${state.firm?.name||'set up agency'}</div></div><div class="kpi-grid"><div class="kpi"><div class="label">Candidates</div><div class="val">${state.candidates.length}</div></div><div class="kpi"><div class="label">Clients</div><div class="val">${state.clients.length}</div></div><div class="kpi"><div class="label">Open vacancies</div><div class="val">${openVacancies()}</div></div><div class="kpi"><div class="label">Active placements</div><div class="val">${activePlacements()}</div></div><div class="kpi"><div class="label">Total fees</div><div class="val">${fmt(totalFees())}</div></div><div class="kpi"><div class="label">Invoiced</div><div class="val">${fmt(totalInvoiced())}</div></div><div class="kpi"><div class="label">Outstanding</div><div class="val" style="color:${totalOutstanding()>0?'var(--amber)':'var(--green)'};">${fmt(totalOutstanding())}</div></div><div class="kpi"><div class="label">AWR approaching</div><div class="val" style="color:${awrDueCount()>0?'var(--red)':'var(--green)'};">${awrDueCount()}</div><div class="hint">${RULES.awrWeeks}-week threshold</div></div></div>`}

function renderCandidates(v){v.innerHTML=`<div class="section-h"><h2>Candidates</h2><div class="sub">${state.candidates.length}</div><div class="actions"><button class="btn brass sm" onclick="openModal('addCandidate')">+ Candidate</button></div></div>${state.candidates.length?`<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Sector</th><th>Status</th><th>RTW</th><th>DBS</th></tr></thead><tbody>${state.candidates.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td>${esc(c.sector)}</td><td><span class="pill ${c.status==='available'?'green':c.status==='placed'?'blue':'amber'}">${c.status}</span></td><td><span class="pill ${c.rtw?'green':'red'}">${c.rtw?'✓':'✗'}</span></td><td>${esc(c.dbsDate||'—')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No candidates. Add candidates or sync from fallrecruitonboard.</div>'}`}

function renderClients(v){v.innerHTML=`<div class="section-h"><h2>Clients</h2><div class="sub">${state.clients.length}</div><div class="actions"><button class="btn brass sm" onclick="openModal('addClient')">+ Client</button></div></div>${state.clients.length?`<table><thead><tr><th>Company</th><th>Contact</th><th>Email</th><th>Sector</th><th>Terms</th><th>Vacancies</th></tr></thead><tbody>${state.clients.map(c=>{const vCount=state.vacancies.filter(v=>v.clientId===c.id).length;return `<tr><td>${esc(c.company)}</td><td>${esc(c.contact)}</td><td>${esc(c.email)}</td><td>${esc(c.sector)}</td><td>${esc(c.termsType||'—')}</td><td>${vCount}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No clients.</div>'}`}

function renderVacancies(v){v.innerHTML=`<div class="section-h"><h2>Vacancies</h2><div class="sub">${openVacancies()} open / ${state.vacancies.length} total</div><div class="actions"><button class="btn brass sm" onclick="openModal('addVacancy')">+ Vacancy</button></div></div>${state.vacancies.length?`<table><thead><tr><th>Title</th><th>Client</th><th>Type</th><th>Rate/Salary</th><th>Status</th><th>IR35</th><th>Candidates</th></tr></thead><tbody>${state.vacancies.sort((a,b)=>(b.ts||0)-(a.ts||0)).map(vc=>{const cl=state.clients.find(c=>c.id===vc.clientId);return `<tr><td>${esc(vc.title)}</td><td>${esc(cl?.company||vc.clientId?.slice(0,8)||'—')}</td><td><span class="pill ${vc.type==='permanent'?'blue':'amber'}">${vc.type}</span></td><td>${vc.type==='permanent'?fmt(vc.salary):fmt(vc.dayRate)+'/day'}</td><td><span class="pill ${vc.status==='open'?'green':vc.status==='filled'?'blue':'red'}">${vc.status}</span></td><td>${vc.type==='temporary'||vc.type==='contract'?esc(vc.ir35||'TBD'):'n/a'}</td><td>${vc.candidateCount||0}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No vacancies.</div>'}`}

function renderPlacements(v){v.innerHTML=`<div class="section-h"><h2>Placements</h2><div class="sub">${activePlacements()} active / ${totalPlacements()} total</div><div class="actions"><button class="btn brass sm" onclick="openModal('addPlacement')">+ Placement</button></div></div>${state.placements.length?`<table><thead><tr><th>Candidate</th><th>Client</th><th>Role</th><th>Type</th><th>Start</th><th>Status</th><th>AWR wk</th><th class="num">Fee</th><th>Invoiced</th></tr></thead><tbody>${state.placements.sort((a,b)=>(b.ts||0)-(a.ts||0)).map(p=>{let awrWk='—';if((p.type==='temporary'||p.type==='contract')&&p.startDate){const w=Math.floor((now()-new Date(p.startDate).getTime())/(7*24*60*60*1000));awrWk=w;if(w>=RULES.awrWeeks)awrWk=`<span style="color:var(--red);font-weight:700">${w} ⚠</span>`}return `<tr><td>${esc(p.candidateName)}</td><td>${esc(p.clientName)}</td><td>${esc(p.role)}</td><td><span class="pill ${p.type==='permanent'?'blue':'amber'}">${p.type}</span></td><td>${esc(p.startDate)}</td><td><span class="pill ${p.status==='active'?'green':p.status==='completed'?'blue':'red'}">${p.status}</span></td><td>${awrWk}</td><td class="num">${fmt(p.fee)}</td><td><span class="pill ${p.invoiced?'green':'amber'}">${p.invoiced?'yes':'no'}</span></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No placements.</div>'}`}

function renderCompliance(v){const checks=[
  {id:'eaa',name:'Employment Agencies Act 1973 compliance',cat:'Core',desc:'Agency registered. No charging work-seekers for finding work (s.6). Terms agreed before services.'},
  {id:'conduct2003',name:'Conduct of Employment Agencies Regulations 2003',cat:'Core',desc:'Written terms to hirers and work-seekers. Suitability checks. Opt-out records. Record keeping 1 year (Reg 29).'},
  {id:'awr',name:'Agency Workers Regulations 2010 compliance',cat:'AWR',desc:'After 12 qualifying weeks: equal pay, working time, facilities. Swedish Derogation abolished April 2020.'},
  {id:'ir35',name:'IR35 / Off-payroll status determinations',cat:'Tax',desc:'Client responsibility (medium/large). SDS issued, right to appeal, reasonable care. CEST tool recommended.'},
  {id:'rtw',name:'Right to Work checks documented',cat:'Immigration',desc:'Immigration, Asylum and Nationality Act 2006. Check before engagement starts. Retain copies 2 years after end.'},
  {id:'dbs',name:'DBS checks (where applicable)',cat:'Safeguarding',desc:'Regulated activity roles: enhanced DBS. Update Service checks. Portability between agencies limited.'},
  {id:'gdpr',name:'GDPR/Data Protection Act 2018 compliance',cat:'Data',desc:'Privacy notices, lawful basis (consent/legitimate interest), data retention policy, candidate data rights (access/erasure/portability).'},
  {id:'hmrc',name:'HMRC PAYE/RTI for temp workers',cat:'Tax',desc:'Operate PAYE for agency workers unless genuinely self-employed or inside PSC. RTI submissions by 19th. Holiday pay calculations.'},
  {id:'insurance',name:'Professional indemnity + public liability',cat:'Insurance',desc:'PI insurance for recruitment advice. PL if placing workers on client sites. Employers liability for temps on agency payroll.'},
  {id:'complaints',name:'Complaints procedure in place',cat:'Governance',desc:'Written complaints procedure accessible to candidates and clients. EAS (Employment Agency Standards Inspectorate) can investigate.'},
  {id:'optout',name:'Opt-out records maintained',cat:'Conduct',desc:'Conduct Regs 2003 Reg 10: work-seeker may opt out of certain provisions. Opt-out must be in writing, cooling-off period '+RULES.optOutCooling+' days.'},
  {id:'equalops',name:'Equal opportunities / anti-discrimination',cat:'Equality',desc:'Equality Act 2010: cannot discriminate in providing recruitment services. Reasonable adjustments. Monitor and report.'},
];
  const done=state.ui.compChecks||[];
  v.innerHTML=`<div class="section-h"><h2>Compliance</h2><div class="sub">${done.length}/${checks.length}</div></div><div style="display:flex;flex-direction:column;gap:6px">${checks.map(c=>{const isDone=done.includes(c.id);return `<div class="card" style="cursor:pointer;padding:12px 16px;${isDone?'opacity:0.6':''}" onclick="toggleComp('${c.id}')"><div style="display:flex;gap:10px;align-items:flex-start"><span style="font-size:16px;flex-shrink:0;width:20px">${isDone?'<span style="color:var(--green)">✓</span>':'○'}</span><div><strong>${esc(c.name)}</strong><div style="font-size:11px;color:var(--cream-muted);margin-top:2px">${esc(c.cat)} · ${esc(c.desc)}</div></div></div></div>`}).join('')}</div>`}
async function toggleComp(id){if(!state.ui.compChecks)state.ui.compChecks=[];const idx=state.ui.compChecks.indexOf(id);if(idx>=0)state.ui.compChecks.splice(idx,1);else state.ui.compChecks.push(id);await persistUI();await auditLog('compliance.toggle',{payload:{id}});render()}

const T0_QA=[
  {q:/conduct|regulation|2003|terms/i,a:'Conduct of Employment Agencies and Employment Businesses Regulations 2003: agencies must agree written terms with hirers AND work-seekers before providing services. Terms must include: fees/charges, notice periods, payment details, opt-out provisions. Records retained for at least 1 year after last provision of services. Employment businesses (temps) must also confirm: pay rate, holiday entitlement, length of assignment, expenses.'},
  {q:/awr|agency.?worker|12.?week|equal/i,a:'Agency Workers Regulations 2010 (AWR): after 12 qualifying weeks in the same role with the same hirer, agency workers are entitled to: equal pay (basic pay, overtime, shift allowances, bonuses, commission, holiday pay), equal access to facilities (canteen, transport, childcare), information about vacancies. Swedish Derogation (pay-between-assignments contracts) abolished 6 April 2020. Anti-avoidance: structuring assignments to prevent qualifying is unlawful.'},
  {q:/ir35|off.?payroll|sds|status|inside|outside/i,a:'Off-payroll working (IR35): since April 2021 (private sector) and April 2017 (public), medium/large end-clients determine employment status for tax (Status Determination Statement). Agency must: pass SDS to worker, deduct tax/NI if inside IR35, allow worker to appeal. HMRC CEST tool recommended (not conclusive). Small company exemption: PSC self-assesses. Factors: control, substitution, mutuality of obligation.'},
  {q:/rtw|right.?to.?work|immigration|visa/i,a:'Immigration, Asylum and Nationality Act 2006: agencies must verify Right to Work before engagement. Acceptable documents: UK/Irish passport, share code from gov.uk, BRP (biometric residence permit), valid visa. Keep copies for duration of employment + 2 years after termination. Online RTW checks via gov.uk share code for non-UK nationals. Civil penalty up to £45,000 per illegal worker (2024 rates). Repeat offence: criminal prosecution.'},
  {q:/fee|charge|transfer|temp.?to.?perm/i,a:'Conduct Regulations 2003: employment businesses cannot charge work-seekers for finding work. Hirer fees: temp-to-perm fees capped at reasonable amount. Extended hire period (transfer fee alternative): max '+RULES.transferFeeCapMonths+' months. After that, no transfer fee. Perm agency fees: typically 15-25% of annual salary, agreed in terms of business. Fee rebate schedules common (pro-rata refund if candidate leaves within guarantee period).'},
  {q:/gdpr|data|privacy|retention/i,a:'UK GDPR / Data Protection Act 2018: lawful basis required for processing candidate data — typically consent (job applications) or legitimate interest (proactive sourcing). Privacy notice required before processing. Data retention: active candidates — duration of relationship + reasonable period; unsuccessful applicants — typically 6-12 months. Rights: access, rectification, erasure, portability. Special category data (disability, health) — explicit consent required. ICO registration mandatory.'},
  {q:/holiday|wtr|working.?time|pay/i,a:'Working Time Regulations 1998: agency workers entitled to 5.6 weeks paid annual leave (28 days for full-time). Holiday pay: calculated on average earnings over 52-week reference period. Rolled-up holiday pay: permitted since January 2024 (Employment Rights (Amendment, Revocation and Transitional Provision) Regulations 2023). Agency must clearly show holiday pay element on payslip if using rolled-up method.'},
  {q:/hmrc|paye|rti|tax|ni/i,a:'HMRC: agency operates PAYE for agency workers on payroll. RTI (Real Time Information): Full Payment Submission by or before each payday. Employer Payment Summary by 19th of following month. Starter/leaver declarations. NI: employer NI on earnings above secondary threshold. Student loan deductions where applicable. HMRC penalties for late filing.'},
  {q:/insurance|indemnity|liability/i,a:'Recruitment insurance: Professional Indemnity (PI) — covers advice and service failures. Public Liability (PL) — injury/damage on client premises. Employers\' Liability (EL) — mandatory for temp workers on agency payroll (min £5M, Employers\' Liability (Compulsory Insurance) Act 1969). Consider also: cyber liability, D&O. REC members may get preferential rates.'},
  {q:/eas|inspectorate|enforcement|penalty/i,a:'Employment Agency Standards Inspectorate (EAS): enforcement body under Employment Agencies Act 1973 and Conduct Regulations 2003. Powers: inspect records, interview staff, issue prohibition orders (banning individuals from running agencies), prosecute. Offences: charging work-seekers, withholding pay, failing to keep records, operating without agreed terms. Maximum fine: unlimited (post-Legal Aid, Sentencing and Punishment of Offenders Act 2012).'},
];
function askT0(q){for(const r of T0_QA){if(r.q.test(q))return {answer:r.a,source:'T0 · UK recruitment rules'}}return null}
async function askT3(q){if(!state.settings.anthropicKey)return null;try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':state.settings.anthropicKey,'anthropic-version':'2023-06-01','content-type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:'You are a UK recruitment agency compliance expert. Conduct Regulations 2003, AWR 2010, IR35 off-payroll, HMRC PAYE, EAS. Concise.\n\n'+q}]})});if(!res.ok)return null;const j=await res.json();return {answer:j.content?.[0]?.text,source:'T3 · Anthropic'}}catch(e){return null}}
function renderQA(v){v.innerHTML=`<div class="section-h"><h2>Q & A</h2><div class="sub">T0 + T3 BYOK</div></div><div class="card" style="max-width:780px"><div class="chat" id="chatBox">${(state.ui.chat||[]).map(m=>`<div class="msg ${m.role}">${esc(m.text)}${m.source?`<div class="src">${esc(m.source)}</div>`:''}</div>`).join('')}</div><div class="chat-input"><input id="chatIn" placeholder="Ask… 'AWR 12-week rule?' · 'IR35 determination?' · 'transfer fees?'" onkeydown="if(event.key==='Enter')askQ()"><button class="btn brass" onclick="askQ()">Ask</button></div></div>`;const box=$('#chatBox');if(box)box.scrollTop=box.scrollHeight}
async function askQ(){const inp=$('#chatIn');if(!inp)return;const q=inp.value.trim();if(!q)return;inp.value='';if(!state.ui.chat)state.ui.chat=[];state.ui.chat.push({role:'user',text:q});render();let r=askT0(q);if(!r)r=await askT3(q);state.ui.chat.push(r?{role:'bot',text:r.answer,source:r.source}:{role:'bot',text:'No T0 match. Add BYOK key for T3.',source:'system'});persistUI();render()}

function openModal(type){const modal=$('#modal');modal.classList.add('open');
  if(type==='settings'){$('#modalTitle').textContent='Settings';$('#modalBody').innerHTML=`<div class="card"><h3>Agency</h3><div class="row"><div class="field"><label>Agency name</label><input id="fName" value="${esc(state.firm?.name||'')}"></div><div class="field"><label>Company no</label><input id="fCoNo" value="${esc(state.firm?.companyNo||'')}"></div></div><div class="field"><label>Address</label><input id="fAddr" value="${esc(state.firm?.address||'')}"></div><div class="row"><div class="field"><label>Phone</label><input id="fPhone" value="${esc(state.firm?.phone||'')}"></div><div class="field"><label>Email</label><input id="fEmail" value="${esc(state.firm?.email||'')}"></div></div><div class="field"><label>ICO registration no</label><input id="fIco" value="${esc(state.firm?.icoNumber||'')}"></div></div><div class="card"><h3>API</h3><div class="field"><label>Anthropic key (T3)</label><input type="password" id="sKey" value="${esc(state.settings.anthropicKey||'')}"></div><div style="margin:10px 0"><label style="font-size:12px"><input type="checkbox" id="sAudit" ${state.settings.auditChain?'checked':''}> Audit chain</label></div></div><div class="actions"><button class="btn ghost sm" onclick="exportAll()">Export</button><button class="btn ghost sm" onclick="importAll()">Import</button><button class="btn danger sm" onclick="wipeAll()">Wipe</button><button class="btn brass" onclick="saveSettings()">Save</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}
  else if(type==='addCandidate'){$('#modalTitle').textContent='Add Candidate';$('#modalBody').innerHTML=`<div class="row"><div class="field"><label>Name</label><input id="cName"></div><div class="field"><label>Email</label><input id="cEmail"></div></div><div class="row"><div class="field"><label>Phone</label><input id="cPhone"></div><div class="field"><label>Sector</label><select id="cSector"><option>IT</option><option>Finance</option><option>Engineering</option><option>Healthcare</option><option>Legal</option><option>Construction</option><option>Education</option><option>Admin</option><option>Other</option></select></div></div><div class="row"><div class="field"><label>Status</label><select id="cStatus"><option>available</option><option>placed</option><option>unavailable</option></select></div><div class="field"><label>Right to work verified</label><select id="cRtw"><option value="1">Yes</option><option value="0">No</option></select></div></div><div class="field"><label>DBS date (if applicable)</label><input type="date" id="cDbs"></div><div class="actions"><button class="btn brass" onclick="addCandidate()">Add</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}
  else if(type==='addClient'){$('#modalTitle').textContent='Add Client';$('#modalBody').innerHTML=`<div class="row"><div class="field"><label>Company</label><input id="clComp"></div><div class="field"><label>Contact name</label><input id="clContact"></div></div><div class="row"><div class="field"><label>Email</label><input id="clEmail"></div><div class="field"><label>Sector</label><select id="clSector"><option>IT</option><option>Finance</option><option>Engineering</option><option>Healthcare</option><option>Legal</option><option>Construction</option><option>Education</option><option>Other</option></select></div></div><div class="row"><div class="field"><label>Terms type</label><select id="clTerms"><option>standard</option><option>PSL</option><option>exclusive</option><option>RPO</option></select></div><div class="field"><label>IR35 size</label><select id="clIr35"><option>large</option><option>medium</option><option>small</option></select></div></div><div class="actions"><button class="btn brass" onclick="addClient()">Add</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}
  else if(type==='addVacancy'){$('#modalTitle').textContent='Add Vacancy';$('#modalBody').innerHTML=`<div class="row"><div class="field"><label>Title</label><input id="vTitle"></div><div class="field"><label>Client</label><select id="vClient">${state.clients.map(c=>`<option value="${c.id}">${esc(c.company)}</option>`).join('')}</select></div></div><div class="row"><div class="field"><label>Type</label><select id="vType" onchange="document.getElementById('vSalary').parentElement.style.display=this.value==='permanent'?'':'none';document.getElementById('vRate').parentElement.style.display=this.value!=='permanent'?'':'none'"><option>permanent</option><option>temporary</option><option>contract</option><option>fixed-term</option></select></div><div class="field"><label>Status</label><select id="vStatus"><option>open</option><option>filled</option><option>closed</option></select></div></div><div class="row"><div class="field"><label>Salary £</label><input type="number" id="vSalary"></div><div class="field" style="display:none"><label>Day rate £</label><input type="number" id="vRate"></div></div><div class="row"><div class="field"><label>IR35 status</label><select id="vIr35"><option>TBD</option><option>inside</option><option>outside</option><option>n/a</option></select></div><div class="field"><label>Candidates submitted</label><input type="number" id="vCands" value="0"></div></div><div class="actions"><button class="btn brass" onclick="addVacancy()">Add</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}
  else if(type==='addPlacement'){$('#modalTitle').textContent='Add Placement';$('#modalBody').innerHTML=`<div class="row"><div class="field"><label>Candidate name</label><input id="pCand"></div><div class="field"><label>Client name</label><input id="pClient"></div></div><div class="row"><div class="field"><label>Role</label><input id="pRole"></div><div class="field"><label>Type</label><select id="pType"><option>permanent</option><option>temporary</option><option>contract</option><option>fixed-term</option></select></div></div><div class="row"><div class="field"><label>Start date</label><input type="date" id="pStart"></div><div class="field"><label>Status</label><select id="pStatus"><option>active</option><option>completed</option><option>cancelled</option></select></div></div><div class="row"><div class="field"><label>Fee £</label><input type="number" id="pFee"></div><div class="field"><label>Invoiced</label><select id="pInv"><option value="0">No</option><option value="1">Yes</option></select></div></div><div class="actions"><button class="btn brass" onclick="addPlacement()">Add</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}
}
function closeModal(){$('#modal').classList.remove('open')}

async function addCandidate(){const c={id:uid('cn'),name:$('#cName').value.trim(),email:$('#cEmail').value.trim(),phone:$('#cPhone').value.trim(),sector:$('#cSector').value,status:$('#cStatus').value,rtw:$('#cRtw').value==='1',dbsDate:$('#cDbs').value,ts:now()};state.candidates.push(c);await idbPut('candidates',c);await auditLog('candidate.added',{payload:{id:c.id}});closeModal();toast('Added');render()}
async function addClient(){const c={id:uid('cl'),company:$('#clComp').value.trim(),contact:$('#clContact').value.trim(),email:$('#clEmail').value.trim(),sector:$('#clSector').value,termsType:$('#clTerms').value,ir35Size:$('#clIr35').value,ts:now()};state.clients.push(c);await idbPut('clients',c);await auditLog('client.added',{payload:{id:c.id}});closeModal();toast('Added');render()}
async function addVacancy(){const vc={id:uid('vc'),title:$('#vTitle').value.trim(),clientId:$('#vClient').value,type:$('#vType').value,status:$('#vStatus').value,salary:Number($('#vSalary').value||0),dayRate:Number($('#vRate').value||0),ir35:$('#vIr35').value,candidateCount:Number($('#vCands').value||0),ts:now()};state.vacancies.push(vc);await idbPut('vacancies',vc);await auditLog('vacancy.added',{payload:{id:vc.id}});closeModal();toast('Added');render()}
async function addPlacement(){const p={id:uid('pl'),candidateName:$('#pCand').value.trim(),clientName:$('#pClient').value.trim(),role:$('#pRole').value.trim(),type:$('#pType').value,startDate:$('#pStart').value,status:$('#pStatus').value,fee:Number($('#pFee').value||0),invoiced:$('#pInv').value==='1',ts:now()};state.placements.push(p);await idbPut('placements',p);await auditLog('placement.added',{payload:{id:p.id}});closeModal();toast('Added');render()}
async function saveSettings(){const f=state.firm||{id:uid('fi'),ts:now()};f.name=$('#fName').value.trim();f.companyNo=$('#fCoNo').value.trim();f.address=$('#fAddr').value.trim();f.phone=$('#fPhone').value.trim();f.email=$('#fEmail').value.trim();f.icoNumber=$('#fIco').value.trim();f.updatedAt=now();state.firm=f;await idbPut('firms',f);state.settings.anthropicKey=$('#sKey').value.trim();state.settings.auditChain=$('#sAudit').checked;$('#tierBadge').textContent=state.settings.anthropicKey?'T3':'T0';await persistUI();closeModal();toast('Saved');render()}
function exportAll(){const d={tool:TOOLNAME,v:VERSION,ts:now(),firm:state.firm,candidates:state.candidates,clients:state.clients,vacancies:state.vacancies,placements:state.placements};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='fallrecruit-export.json';a.click();URL.revokeObjectURL(u);toast('Exported')}
function importAll(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.firm){state.firm=d.firm;await idbPut('firms',d.firm)}for(const k of['candidates','clients','vacancies','placements']){if(Array.isArray(d[k]))for(const r of d[k]){state[k].push(r);await idbPut(k,r)}}persistUI();toast('Imported');render()}catch(e){toast('Failed')}};inp.click()}

// ════════════════════════════════════════════════════════════════
// THE GATED AUDIT CHAIN — inlined verbatim by build-page.mjs: the shared kernel from fallhardened
// plus this repo's own byte layout.
//
// ⚑ SCOPED IN A CLOSURE. The kernel exports names the app also uses; left at top level a later
// declaration would silently win and every call site would be passing the wrong arguments to a
// function that still looked right.
// Do not edit between the markers: edit audit.mjs, re-run the gate, rebuild the page.
// ════════════════════════════════════════════════════════════════
const AUDITCHAIN=(function(){
/* __AUDIT_KERNEL__ */
// audit-chain.mjs — a tamper-evident log that can actually be checked.
//
// ⚑ WHY THIS EXISTS. Nine tools in this estate write a hash-linked audit log — clinic, vet, HR,
// recruitment, claims, legal, insurance, books, practice — and not one of them ever re-walked it.
// prevHash and docHash were written on every action and never read back, so the tamper-evidence was
// a claim about the data rather than a property of it. A regulator asking "prove this was not edited"
// would have been handed a log that could not answer.
//
// ⚑ AND WHY IT IS A FACTORY. The bug underneath the bug is that a writer and a verifier can disagree
// about WHICH BYTES were signed, and then a check passes that should not — or fails when nothing is
// wrong. Here both come out of one call and close over the same `payloadOf`, so they cannot drift.
// You cannot construct a verifier for one layout and a writer for another by accident.
//
// The byte layout itself is deliberately NOT fixed: the nine tools each sign different fields, and
// forcing one shape would either break their existing logs or quietly re-define what was signed.

/** The hash a chain starts from. An empty string, so the first entry has nothing behind it. */
const GENESIS = '';

const isFn = (f) => typeof f === 'function';

/**
 * Build a chain that can write and check its own entries.
 *
 * @param opts.sha256    async (string) => hex digest. Injected so this stays pure and testable.
 * @param opts.payloadOf (prevHash, entry, index) => string — exactly the bytes that get signed.
 *                   May return a promise: one tool in this estate hashes the payload first and signs
 *                   THAT, so the layout itself needs to await a digest.
 * @param opts.hashField which field on an entry holds the chain hash. Default "docHash". One tool
 *                   keeps two hashes — a docHash over the payload and a separate `hash` for the
 *                   link — so the field cannot be assumed.
 */
function auditChain(opts) {
  // A default parameter does not fire on an explicit null, and null is what a caller reading a
  // missing config hands you. Normalise, then read.
  const o = (opts && typeof opts === 'object') ? opts : {};
  const sha256 = o.sha256;
  const payloadOf = o.payloadOf;
  const hashField = (typeof o.hashField === 'string' && o.hashField) ? o.hashField : 'docHash';
  // ⚑ NOT EVERY CHAIN STARTS AT THE EMPTY STRING. One tool in this estate opens its log with 64
  // zeros. Assuming genesis would make its very first entry fail to verify, for ever.
  const genesis = (typeof o.genesis === 'string') ? o.genesis : GENESIS;
  if (!isFn(sha256)) throw new Error('auditChain needs a sha256(string) function');
  if (!isFn(payloadOf)) throw new Error('auditChain needs a payloadOf(prevHash, entry, index) function');

  /**
   * The hash the next entry must link to.
   *
   * The last row is read defensively because a corrupt log is exactly when this gets called: a null
   * or non-object at the end used to throw here, which turned "your audit log has a bad row" into
   * "the app crashed while trying to write an audit entry".
   */
  function headOf(entries) {
    const log = Array.isArray(entries) ? entries : [];
    if (!log.length) return genesis;
    const last = log[log.length - 1];
    if (!last || typeof last !== 'object') return genesis;
    return String(last[hashField] ?? '');
  }

  /**
   * Seal an entry onto the end of the log. Returns a NEW entry carrying prevHash and docHash —
   * it does not mutate what it was given, because an audit writer that edits its input is the
   * first thing anyone should distrust.
   */
  async function append(entries, entry) {
    const log = Array.isArray(entries) ? entries : [];
    const prevHash = headOf(log);
    // ⚑ RESPECT THE CALLER'S NUMBERING. These tools number entries from 1 and SIGN that number.
    // Overwriting it with a zero-based position would renumber every new entry and quietly change
    // what gets hashed.
    const given = (entry && typeof entry === 'object') ? entry.i : undefined;
    const i = Number.isFinite(given) ? given : log.length;
    const base = { ...(entry && typeof entry === 'object' ? entry : {}), i, prevHash };
    // ⚑ THE THIRD ARGUMENT IS THE POSITION IN THE LOG, NOT THE ENTRY'S OWN NUMBER. verify() walks the
    // array and passes the array index, so append must pass the same thing or a one-based log signs
    // one value and verifies against another — every entry written would fail its own check.
    // A layout that wants the entry's number reads it off the entry, where it lives.
    const pos = log.length;
    // await, because a layout may itself need to hash something before it can say what is signed.
    const digest = await sha256(await payloadOf(prevHash, base, pos));
    return { ...base, [hashField]: digest };
  }

  /**
   * Walk the log and report the FIRST entry that does not reproduce. The earliest break is when the
   * tampering happened; everything after it is just that break's wake, so reporting later ones would
   * bury the answer.
   *
   * `expectHead` is optional and closes the one hole a chain cannot close on its own — see below.
   */
  async function verify(entries, checkOpts) {
    const log = Array.isArray(entries) ? entries : [];
    const c = (checkOpts && typeof checkOpts === 'object') ? checkOpts : {};
    let prev = genesis;

    for (let i = 0; i < log.length; i++) {
      const e = (log[i] && typeof log[i] === 'object') ? log[i] : {};
      if (String(e.prevHash ?? '') !== prev) {
        return { ok: false, brokeAt: i, id: e.id ?? null, entries: log.length,
                 reason: 'this entry does not link to the one before it — something was inserted, removed or reordered' };
      }
      const expected = await sha256(await payloadOf(prev, e, i));
      if (expected !== e[hashField]) {
        return { ok: false, brokeAt: i, id: e.id ?? null, entries: log.length,
                 reason: 'this entry was altered after it was written' };
      }
      prev = e[hashField];
    }

    // ⚑ THE HONEST BOUND. A chain proves nothing was changed or removed from the MIDDLE. Delete the
    // last few entries and what remains is a perfectly valid chain — the log simply looks shorter.
    // The only defence is knowing what the head should be, from somewhere the editor could not reach.
    // Without expectHead this returns ok:true and SAYS the tail is unproven, rather than implying a
    // completeness it cannot demonstrate.
    if (c.expectHead != null) {
      if (String(c.expectHead) !== prev) {
        return { ok: false, brokeAt: log.length, id: null, entries: log.length,
                 reason: 'the log ends earlier than it should — entries were removed from the end' };
      }
      return { ok: true, entries: log.length, tailProven: true,
               reason: 'every entry reproduces its own hash, and the log ends where it was expected to' };
    }

    return {
      ok: true, entries: log.length, tailProven: false,
      reason: log.length
        ? 'every entry reproduces its own hash — but nothing here can prove entries were not removed from the END; keep the head hash somewhere separate to close that'
        : 'the log is empty',
    };
  }

  return { append, verify, headOf, payloadOf };
}


// audit.mjs — fallrecruit's audit layout, and the chain built from it.
//
// ⚑ THE BYTES MUST NOT CHANGE. There are logs in the wild signed by the old inline writer. If this
// layout differs by one character, every entry a firm has already written stops reproducing and the
// verifier reports its whole history as tampered. Making a real audit trail look forged is a worse
// outcome than not checking it at all, so this is a faithful copy and audit.test.mjs pins it against
// the original formula.
//
// The chain semantics live in the shared, separately-gated audit-chain kernel. Only the byte layout
// is this repo's business.

function payloadOf(prevHash, entry, index) {
  const e = (entry && typeof entry === 'object') ? entry : {};
  return JSON.stringify({ i: e.i, ts: e.ts, action: e.action, prevHash: String(prevHash == null ? '' : prevHash), payload: e.payload ?? {} });
}

/** The writer and the checker, from one call, over one layout — so they cannot drift apart. */
function makeAuditChain(sha256) {
  return auditChain({
    sha256,
    payloadOf: payloadOf,
    hashField: "docHash",
  });
}


/* __END_AUDIT_KERNEL__ */
return makeAuditChain(sha256);
})();
</script>

<script type="module">

      const fn = window._app?.[a.id];
      if (typeof fn === 'function') return fn(params);
      alert('Autopilot proposes: ' + a.name + ' · params: ' + JSON.stringify(params) + '\n\nThis tool has not yet implemented the ' + a.id + ' handler. Proposal logged to audit.');
      return { stub: true, action: a.id, params };
    }}));
    manifest.state = () => ({ ...(window._app || {}), now: new Date().toISOString() });
    installAutopilot(manifest);
  } catch (e) { console.warn('[autopilot] init failed:', e); }
</script>
